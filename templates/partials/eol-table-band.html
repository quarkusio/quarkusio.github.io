<div class="full-width-bg component-slim">
    <div class="grid-wrapper eol-table-band">
        <div class="width-12-12">
            <h2>EOL Versions</h2>
            <div class="table-responsive">
                <table class="releases-table">
                    <thead>
                        <tr>
                            <th>Release</th>
                            <th>Released</th>
                            <th>End of Life</th>
                            <th>Final Patch</th>
                        </tr>
                    </thead>
                    <tbody>
                        {#for release in cdi:releaseCatalog.endOfLife(now)}
                        <tr>
                            <td>
                                {=release.version.raw}
                                {#if release.lts}<span class="release-badge lts">LTS</span>{/if}
                            </td>
                            <td>{=release.releaseDate.format('dd MMM yyyy').or('').raw}</td>
                            <td>{=release.eolDate.format('dd MMM yyyy').or('').raw}</td>
                            <td>{=release.latestPatch.raw}</td>
                        </tr>
                        {/for}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
