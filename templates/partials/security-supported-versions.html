{#let supported=cdi:releaseCatalog.supportedVersions(now)}
<table class="tableblock frame-all grid-all fit-content">
<colgroup>
<col>
<col>
</colgroup>
<thead>
<tr>
<th class="tableblock halign-left valign-top">Version</th>
<th class="tableblock halign-center valign-top">Supported</th>
</tr>
</thead>
<tbody>
<tr>
<td class="tableblock halign-left valign-top"><p class="tableblock">Latest {=supported.latestMajor.raw}.x</p></td>
<td class="tableblock halign-center valign-top"><p class="tableblock">✅</p></td>
</tr>
{#for release in supported.otherLts}
<tr>
<td class="tableblock halign-left valign-top"><p class="tableblock">{=release.version.raw} LTS</p></td>
<td class="tableblock halign-center valign-top"><p class="tableblock">✅</p></td>
</tr>
{/for}
<tr>
<td class="tableblock halign-left valign-top"><p class="tableblock">Older {=supported.latestMajor.raw}.x</p></td>
<td class="tableblock halign-center valign-top"><p class="tableblock">❌</p></td>
</tr>
<tr>
<td class="tableblock halign-left valign-top"><p class="tableblock">&lt; {=supported.latestMajor.raw}.0</p></td>
<td class="tableblock halign-center valign-top"><p class="tableblock">❌</p></td>
</tr>
</tbody>
</table>
{/let}
