{! Params: legend (list of io.quarkusio.timeline.LegendItem). Provider keys get their own row. !}
<ul class="tl-legend">
    {#for item in legend}{#if !item.provider}
    <li><span class="tl-swatch tl-swatch--{=item.kind.raw}" aria-hidden="true"></span> <strong>{=item.label.raw}</strong> <span class="tl-legend-desc">{=item.description.raw}</span></li>
    {/if}{/for}
</ul>
<ul class="tl-legend tl-legend--providers" aria-label="Provider colours">
    {#for item in legend}{#if item.provider}
    <li title="{=item.description.raw}"><span class="tl-swatch tl-swatch--{=item.kind.raw}" aria-hidden="true"></span> <strong>{=item.label.raw}</strong></li>
    {/if}{/for}
</ul>
