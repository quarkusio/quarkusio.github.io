<div class="table-responsive">
    <table class="cves-table">
        <thead>
            <tr>
                <th class="sortable" data-sort="advisory" title="Click to sort by Advisory">Advisory <i class="fas fa-sort"></i></th>
                <th class="sortable sort-active sort-desc" data-sort="severity" title="Click to sort by Severity">Severity <i class="fas fa-sort-down"></i></th>
                <th class="sortable" data-sort="published" title="Click to sort by Published date">Published <i class="fas fa-sort"></i></th>
                <th class="sortable" data-sort="fixed" title="Click to sort by Fixed in release">Fixed in <i class="fas fa-sort"></i></th>
                <th class="sortable" data-sort="affects" title="Click to sort by Affected components">Affects <i class="fas fa-sort"></i></th>
                <th>Summary</th>
            </tr>
        </thead>
        <tbody>
            {#for f in findings}
            <tr data-advisory="{=f.id}"
                data-severity="{=f.severity.or('')}"
                data-published="{=f.published.or('')}"
                data-fixed="{=f.fixed_in.or('')}"
                data-affects="{#for a in f.affects}{=a} {/for}">
                <td>
                    <a href="https://github.com/advisories/{=f.id}">{=f.id}</a>
                    {#if f.cve}<br/><span class="cves-cve-id">{=f.cve}</span>{/if}
                </td>
                <td><span class="cves-severity {=f.severity.toLowerCase}">{=f.severity}</span></td>
                <td>{=f.published.or('')}</td>
                <td>
                    {#if f.fixed_in}
                    <span class="cves-fixed-in">{=f.fixed_in}</span>
                    {#else}
                    <span class="cves-not-fixed">—</span>
                    {/if}
                </td>
                <td>{#for a in f.affects}<code>{=a}</code>{#if a_hasNext}<br/>{/if}{/for}</td>
                <td>{=f.summary.or('')}</td>
            </tr>
            {/for}
        </tbody>
    </table>
</div>
