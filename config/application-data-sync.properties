# Profile for the data sync jobs (see io.quarkusio.releases.sync.ReleasesSyncJob).
# The job runs at startup and exits. Only the data is needed: no content is processed.
#
#   ./mvnw package -DskipTests -Dquarkus.profile=data-sync
#   GITHUB_TOKEN=... java -Dquarkus.profile=data-sync -jar target/quarkus-app/quarkus-run.jar
site.ignored-files=**
quarkus.http.port=0
# Collections generated from data need their layouts, which are ignored
site.collections.author=false
