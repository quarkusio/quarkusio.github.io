# Quarkus release data
#
# Automated fields (updated by tools/releases-sync):
#   micros (every published micro release, newest first), release_date, rhbq.release_date, ibm.release_date
#   upcoming releases (upcoming, planned_date, lts, proposal), from the Release Planning wiki
#
# Everything else is hand-edited:
#   policy, support_providers, eol_support, lts, eol_date, link, branched_from, upcoming, provider blocks (rhbq, ibm, herodevs)
#   (ibm open_ended: true: IBM keeps supporting the release with no end date after its eol_date;
#    herodevs open_ended: true: HeroDevs Never-Ending Support, once all other support has ended)
#   (upcoming entries the wiki has no usable date for are kept as hand-edited: upcoming, planned_date)

policy:
  # Lengths are an amount plus a unit (weeks or months)
  lts_cadence:
    amount: 6
    unit: months
  lts_support_duration:
    amount: 12
    unit: months
  release_cadence:
    amount: 4
    unit: weeks
  non_lts_support_duration: "until the next minor release"
  # {lts_cadence}, {lts_support_duration} and {release_cadence} are filled in from the values above
  lts_description: >
    LTS releases receive critical bug fixes and security patches
    for {lts_support_duration} from their initial release date.
  eol_description: >
    When a Quarkus release reaches End-of-Life, it no longer receives
    security patches, bug fixes, or community support. Running EOL
    versions exposes your applications to unpatched vulnerabilities,
    ecosystem drift, and compliance risks.

support_providers:
  rhbq:
    name: "Red Hat Build of Quarkus"
    url: "https://access.redhat.com/products/quarkus"
  ibm:
    name: "IBM Enterprise Build of Quarkus"
    url: "https://www.ibm.com/products/enterprise-build-of-quarkus"
  herodevs:
    name: "HeroDevs Never-Ending Support"
    url: "https://www.herodevs.com/support/nes-for-quarkus"

eol_support:
  - name: "HeroDevs Never-Ending Support (NES)"
    url: "https://www.herodevs.com/support/nes-for-quarkus"
    description: >
      HeroDevs provides continued security patches and compliance
      support for EOL Quarkus versions, bridging the gap while
      you plan your upgrade.

