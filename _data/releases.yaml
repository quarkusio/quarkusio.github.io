# Quarkus release data
#
# Automated fields (updated by tools/releases-sync):
#   micros (every micro and candidate, newest first, from GitHub and the platform BOMs on Maven Central;
#   pre-releases are marked candidate, beta or alpha), each with its parent_release (the micro it was built from),
#   rhbq.micros, ibm.micros (the vendor's own builds, with their parent_release),
#   release_date, rhbq.release_date, ibm.release_date, provider parent_release (when not set),
#   parent_release of published 3.x+ LTS releases (when not set),
#   rhbq.eol_date, ibm.eol_date,
#   upcoming releases (upcoming, planned_date, lts, proposal), from the Release Planning wiki
#
# Everything else is hand-edited:
#   policy, support_providers, eol_support, lts, eol_date, link, parent_release, upcoming, provider blocks (rhbq, ibm, herodevs)
#   (a parent_release, of a release, micro or provider, set by hand is never overwritten)
#   (last_in_major: true on a vendor block marks the vendor's last minor of a major stream; set automatically once the vendor ships a newer major.
#    Red Hat: any other minor ends six months after the next minor is released, the way the Red Hat policy page has it (a previous minor is in
#    maintenance for six months). The last minor ends 3 years after the first release of the major, but no earlier than six months after the
#    first release of the next major, since full support ends when the next major is released. IBM: a year after its release, and 5 years
#    from the first release of the major for the last minor. Those dates are recomputed when the later release appears, except that a last
#    minor's date is never shortened, since Red Hat publishes it. Until then the last minor's rhbq.eol_date is a hand-edited placeholder, from
#    the Red Hat support policy page)
#   (ibm open_ended: true: IBM keeps supporting the release with no end date after its eol_date;
#    herodevs open_ended: true: HeroDevs Never-Ending Support, once all other support has ended)
#   (upcoming entries the wiki has no usable date for are kept as hand-edited: upcoming, planned_date)

policy:
  # Lengths are an amount plus a unit (weeks or months)
  lts_cadence:
    amount: 6
    unit: months
  lts_support_duration:
    amount: 12
    unit: months
  release_cadence:
    amount: 4
    unit: weeks
  non_lts_support_duration: "until the next minor release"
  # {lts_cadence}, {lts_support_duration} and {release_cadence} are filled in from the values above
  lts_description: >
    LTS releases receive critical bug fixes and security patches
    for {lts_support_duration} from their initial release date.
  eol_description: >
    When a Quarkus release reaches End-of-Life, it no longer receives
    security patches, bug fixes, or community support. Running EOL
    versions exposes your applications to unpatched vulnerabilities,
    ecosystem drift, and compliance risks.

support_providers:
  rhbq:
    name: "Red Hat Build of Quarkus"
    url: "https://access.redhat.com/products/quarkus"
  ibm:
    name: "IBM Enterprise Build of Quarkus"
    url: "https://www.ibm.com/products/enterprise-build-of-quarkus"
  herodevs:
    name: "HeroDevs Never-Ending Support"
    url: "https://www.herodevs.com/support/nes-for-quarkus"

eol_support:
  - name: "HeroDevs Never-Ending Support (NES)"
    url: "https://www.herodevs.com/support/nes-for-quarkus"
    description: >
      HeroDevs provides continued security patches and compliance
      support for EOL Quarkus versions, bridging the gap while
      you plan your upgrade.

