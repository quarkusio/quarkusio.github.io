headline: Self-paced Quarkus workshops
workshops:
- url: "https://quarkus.io/quarkus-workshops/super-heroes/index.html"
  title: "Superheroes Workshop"
  thumbnail: "https://quarkus.io/quarkus-workshops/super-heroes/images/0-introduction-physical-architecture.png"
  description: A customisable workshop which covers Quarkus basics with optional modules on LangChain4j, Kubernetes, messaging, Pact, writing extensions, and more. The best starting point for trying out Quarkus.
  src: https://github.com/quarkusio/quarkus-workshops
  stars: 189
- url: "https://quarkus.io/quarkus-workshop-langchain4j/"
  title: "LangChain4j Workshop"
  thumbnail: "https://quarkus.io/quarkus-workshop-langchain4j/images/global-architecture.png"
  description: A deep-dive into LangChain4j.
  src: https://github.com/quarkusio/quarkus-workshop-langchain4j
  stars: 99
- url: "https://redhat-scholars.github.io/quarkus-sandbox-tutorial/rhs-quarkus-guides/RHDS/index.html"
  title: "Quarkus and OpenShift"
  thumbnail: "https://redhat-scholars.github.io/quarkus-sandbox-tutorial/rhs-quarkus-guides/RHDS/_images/initnav.png"
  description: A Developer Sandbox-based workshop. The workshop uses Eclipse Che to develop Quarkus apps and deploy them to a Kubernetes cluster (based on OpenShift). It does not require local setup, but does require external services to be provisioned.
