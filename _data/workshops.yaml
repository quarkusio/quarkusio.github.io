  stars: 49
- url: "https://github.com/quarkusio/quarkus-workshop-agentic"
  title: "Agentic Workshop"
  thumbnail: "https://github.com/quarkusio/quarkus-workshop-agentic/raw/main/solution/parasol-service/src/main/webui/src/app/assets/images/sample.png"
  description: A workshop to learn how to build Agentic AI applications with Quarkus and LangChain4j.
