headline: "Monthly Newsletters"

newsletter:

- title: "October 2026 Newsletter #73"
  date: "October 15, 2026"
  blog_link: /blog/quarkus-newsletter-73/
  newsletter_link: /newsletter/713/
  summary: "Check out \"IBM Bob ACP in Quarkus A Local Control Plane, Not a Shared Chat App\" by Markus Eisele to how permission futures, workspace bounds, and loopback binding show why this client stays on one machine until you add auth, quotas, and audit. JobRunr v9 draws every attempt and every durable step of a job on a chart. JobRunr Pro v9 adds Job Analytics to the dashboard, can pause and resume a batch halfway and starts jobs within milliseconds on Postgres, without multicast. Get the details in \"JobRunr & JobRunr Pro v9: See Inside Every Background Job\" by the JobRunr Team. The quarkus.io site is now built with Quarkus Roq. Read Holly Cummins’s blog post to learn how we migrated quarkus.io from Jekyll to Quarkus Roq by converting 40,000 files, delivering faster builds, quicker page loads, and simplified Java-based local development. Fouad Almalki’s \"Build AWT and Swing desktop applications with Quarkus Desktop\" shows how Quarkus Desktop brings AWT and Swing applications to Quarkus, in JVM mode and as native executables on Windows, Linux, and macOS. Read \"Quarkus Goblin: Learn Chaos Engineering on One REST Call\" by Markus Eisele to learn how to build a quote API that calls inventory, inject latency and HTTP 503s, and watch timeout, retry, and fallback take over.a"

- title: "Quarkus Newsletter #72 - September"
  date: "September 16, 2026"
  blog_link: /blog/quarkus-newsletter-72/
  newsletter_link: /newsletter/72/
  summary: "Read Markus Eisele's \"Build Token Exchange Between Three Quarkus Services\" to follow a user token from the order service to inventory and audit, then test why each service rejects a token meant for another audience. Learn how to integrate Quarkus, LangChain4j, and a large language model to generate custom poetry in \"Create your first generative AI Java application with Quarkus and LangChain4j\" by Laura Cowen. Quarkus 4 raises the Java baseline to 21. Check out \"Java 21: the foundation for Quarkus 4\" by Clement Escoffier to see why we made this choice and what it means for you. Check out this two part series from Daniel Oh. Check out \"Part 1: Building Governed MCP Tool Services With Quarkus LangChain4j and Goose\" to see how. To build governed, cloud-native Java MCP tool services for Goose agents using Quarkus LangChain4j, Java 25, and Jakarta Bean Validation. Then read \"Part 2: Securing and Scaling Goose-to-Java Agent Traffic With agentgateway\" learn now to deploy agentgateway as a security proxy between Goose AI agents and Quarkus MCP servers to enforce JWT auth, RBAC, and tool-poisoning guardrails. You will also see the latest Quarkus Insights episodes, top social posts and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #71 - August"
  date: "August 13, 2026"
  blog_link: /blog/quarkus-newsletter-71/
  newsletter_link: /newsletter/71/
  summary: "We found our benchmark was measuring Spring's warmup, not its peak. We changed it. Spring's numbers went up. Quarkus's didn't. That's what fairness looks like. Learn more in \"Improving a Competitor's Numbers (On Purpose)\" by Francesco Nigro. The OpenJDK team says don't pool virtual threads. We tested that advice with data, tried to fix the JVM when pooling broke, and discovered why the fix made things worse. Get the details in \"To Cache or Not to Cache Virtual Threads\" also by Francesco Nigro. Markus Eisele demonstrates a measured deployment option for teams that need faster container startup while keeping JVM diagnostics, agents, and compatibility in \"Faster JVM Startup with Quarkus and Project Leyden\". Also check out \"Build Your First Hardened Quarkus Image with Jib and Java 25\" by Markus Eisele to learn how to create a small REST service, package it without a Dockerfile, and verify what really runs inside the container. Read Eddie Carpenter's cool post about a tiny extension that renders your application name as a bold startup banner, so you always know which service just scrolled past in the logs. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #70 - July"
  date: "July 17, 2026"
  blog_link: /blog/quarkus-newsletter-70/
  newsletter_link: /newsletter/70/
  summary: "Read Fabio Burzigotti's post to learn about implementing input guardrails with Open Policy Agent (OPA) for secure LLM applications. See how the Quarkus Pi4J Extension makes it easier than ever to build hardware-enabled applications using the Quarkus ecosystem in \"Quarkus Pi4J Extension\" by Igor De Souza. Andy Damevin provides a step-by-step tutorial: build a Lit web component for comments backed by a Quarkus REST API on your Roq blog in \"Add Comments to Your Blog with a Web Component (30min)\". Check out \"Quarkus Multitenancy Without Tenant Plumbing in Every Service\" by Markus Eisele to see what the Quarkiverse Multitenancy extension gives you: one resolution point, clean domain code, and three tested resolution modes for database-per-tenant isolation. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #69 - June"
  date: "June 09, 2026"
  blog_link: /blog/quarkus-newsletter-69/
  newsletter_link: /newsletter/69/
  summary: "Read \"Empower your AI migrations to Quarkus with Skills\" by Charles Moulliard to learn how to transform your AI agent into a framework domain: dependencies, jpa, web, etc expert capable of migrating Spring applications. Learn how to empower developers to make energy-aware design decisions with Quarkus in Christophe Laprun's \"Measuring energy consumption of Quarkus applications\". Check out Matheus Oliveira's article, \"Floci: a Free, Drop-in LocalStack Alternative Built on Quarkus\" to get a hands-on guide to Floci, the free open-source LocalStack alternative built on Quarkus. Run AWS locally with docker compose, drive S3, DynamoDB, SQS and Lambda from the CLI, wire a Quarkus app to it two ways (the amazon-services Dev Services floci provider and the Floci Testcontainers module), and migrate from LocalStack at the image and Dev Services level. Learn how LangChain4j 1.15.0`s voting pattern uses parallel multi-critic evaluation and runtime model switching to build smarter, cost-efficient agentic systems with Quarkus in \"Parallel voting and adaptive model selection: smarter agentic AI on a budget\" by Mario Fusco. Quarkus 3.35 introduces Profile-Guided Optimization (PGO) support for native images. Enable it with quarkus.native.pgo.enabled=true and let your integration tests drive the profiling - the build automatically produces an optimized native binary tailored to your application's actual runtime behavior. Learn how in Georgios Andrianakis's article \"Profile-Guided Optimization for Quarkus Native Images\" You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #68 - May"
  date: "May 14, 2026"
  blog_link: /blog/quarkus-newsletter-68/
  newsletter_link: /newsletter/68/
  summary: "Read “Introducing Quarkus Agent MCP: teaching AI agents to speak Quarkus” by Phillip Kruger to lear how Quarkus Agent MCP is a standalone MCP server that lets AI coding agents create, manage, and work effectively with Quarkus applications. Extension authors can ship coding skills that agents pick up automatically. See how Quarkus Dev Services streamlines microservice development by automatically provisioning infrastructure like PostgreSQL, Kafka and Redis with zero config in “Quarkus Dev Services: Zero-config development” by A N M Bazlur Rahman. Check out Georgios Andrianakis’s “Faster Startup on IBM Semeru with OpenJ9 Shared Classes Cache” to see Quarkus 3.35 brings great startup improvements to IBM Semeru Runtimes. The same quarkus.package.jar.aot.enabled=true flag that activates Project Leyden on HotSpot-based JVMs now automatically generates an OpenJ9 Shared Classes Cache - no code changes needed. Get a hands-on walkthrough that shows where MCP tools belong, where the model belongs, and how the full LangChain4j flow fits together with “Build Hybrid MCP Tool Agents in Quarkus” by Markus Eisele. Markus Eisele also wrote “Make Agent Workflows Inspectable Before Production” to show how a small Quarkus service exposes live topology and recent executions, which makes agent systems easier to review, debug, and operationalize. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #67 - April"
  date: "April 22, 2026"
  blog_link: /blog/quarkus-newsletter-67/
  newsletter_link: /newsletter/67/
  summary: "Read \"Build a Streaming AI Chat in Java with Quarkus, Vaadin, and LangChain4j\", a hands-on guest post by Sebastian Kühnau showing how to stream LLM responses token by token in a pure Java UI with Vaadin Flow and Quarkus. Check out Mario Fusco's post to learn our reasoning behind enabling by default in the Quarkus 3.35 release. Scivics Lab wrote a post \"quarkus-chat-ui: A Web Front-End for LLMs, and a Real-World Case for POJO-actor\" that introduces a new Chat UI component built with Vaadin and designed to integrate seamlessly into a Quarkus application, simplifying the creation of conversational interfaces. They then follow with another \"quarkus-chat-ui (2): The Actor Design Behind LLM-to-LLM Conversation\" so you can see how to actually use POJO-actor in quarkus-chat-ui, a Quarkus-based LLM chat UI that connects to Claude Code CLI, vLLM, and other backends. Learn how to integrate Redis caching and data storage in a Quarkus Java application using the Quarkus Redis extension with reactive by reading \"How to Use Redis with Quarkus in Java\" by Nawaz Dhandala. Markus Eisele wrote \"AI Coding Tools in 2026: How to Work With Agents Without Losing Control\" a Java engineer’s operating model: Ask/Plan/Code flows, guardrails, and review discipline at scale. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #66 - March"
  date: "March 19, 2026"
  blog_link: /blog/quarkus-newsletter-66/
  newsletter_link: /newsletter/66/
  summary: "In order to provide a transparent and comprehensive performance picture, Quarkus rebuilt its benchmark. Learn more in \"Quarkus has great performance – and we have new evidence\" by Holly Cummins. Read \"How Project Leyden brought a new perspective\" by Guillaume Smet to see how Project Leyden gave us a new perspective on how we think about startup performance in Quarkus. Check out Juarez Junior's post \"Unleash the Power of AI Agents with Java: Building Intelligent Applications with Quarkus, LangChain4j, and Oracle AI Database\" to learn how to build a Quarkus-based AI support agent that handles customer support for Oracle database error codes. See how executable architecture tests with Taikai replace diagrams, reviews, and tribal knowledge in modern Java systems in \"Your Java Architecture Is Lying to You: Enforcing Real Boundaries with Quarkus\" by Markus Eisele. Nowadays, Java enterprise applications often default to Angular, React, or Vue for the frontend. But for this kind of applications, the most natural UI framework already exists in the Java ecosystem: Jakarta Faces. Learn more in \"Rethinking Java Web UIs with Jakarta Faces and Quarkus\" by Nicolas Duminil. See how Markus Eisele built a streaming ingestion pipeline with SSE, batching, and PostgreSQL to track Java-related conversations in \"Listening to the Fediverse with Java: A Real-Time Quarkus Experiment\". Read \"DPoP: What It Is, How It Works, and Why Bearer Tokens Aren’t Enough\" by Hüseyin Akdoğan to learn what DPoP (Demonstration of Proof-of-Possession) is, what problem it solves, and walk through a working implementation with Keycloak and Quarkus. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #65 - February"
  date: "February 13, 2026"
  blog_link: /blog/quarkus-newsletter-65/
  newsletter_link: /newsletter/65/
  summary: "Although focused on microservices, Quarkus is also perfectly suited for large monoliths, whether you are migrating existing applications to a more modern runtime or building new ones from scratch. Quarkus has always been able to handle large applications, but we have recently made significant improvements in this area, particularly when it comes to build times. Read \"Towards faster builds\" by Guillaume Smet to learn more about these improvements. Read \"Implementing an arXiv MCP Server with Quarkus in Java\" by Guillaume Laforge to learn about building an MCP server to access the arXiv research paper website where pre-print versions are published and shared with the community. The author's goal was to shed light on some lesser-known aspects of the Model Context Protocol, tools, resources and prompts. Learn the details of why Anand Jaisy chose to switch frameworks in \"Micronaut vs Quarkus: Why I Switched After Two Years\". Check out \"How to Trace Quarkus Reactive Messaging with OpenTelemetry\" by Nawaz Dhandala to learn how to implement distributed tracing for Quarkus Reactive Messaging applications using OpenTelemetry to track messages across Kafka and other messaging systems. Make sure you try this realistic Java walkthrough showing validation, retries, idempotency, and Kafka-backed workflows with Quarkus in \"Your Second Reactive Messaging App: What Production Systems Actually Need\" by Markus Eisele. Then you can learn about using graph-based analysis to detect and prevent architectural decay in Java applications in his second blog post, \"Your Quarkus Architecture Is Drifting. JQAssistant Can Prove It.\" You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #64 - January"
  date: "January 15, 2026"
  blog_link: /blog/quarkus-newsletter-64/
  newsletter_link: /newsletter/64/
  summary: "Check out this great \"Why Quarkus Finally “Clicks”: The 10 Questions Java Developers Ask Most\" by Markus Eisele as it's a great field guide based on real conversations at conferences, meetups, and across The Main Thread community. Read \"Quarkus Hibernate with Panache Next\" by Stéphane Épardaud to learn about the new Hibernate with Panache extension to unify both Hibernate ORM with Panache and Hibernate Reactive with Panache. Want a complete hands-on tutorial for modern, data-oriented application design? Markus Eisele has you covered with \"Build Event-Sourced Systems in Quarkus with Java Records and CQRS\". Check out Stéphane Philippart's blog post to learn how and why to migrate your Jekyll blog to Quarkus Roq. Read \"Modern Java Meets Native Power: Image Processing with the FFM API in Quarkus\" by Markus Eisele to see how Java 25 integrates with ImageMagick to unlock fast, safe, zero-JNI native workflows. Want a simple way to disable all endpoints in a Quarkus application based on a configuration property? Check out Damir Arh's post \"Disable Quarkus endpoints with a request filter\" for some great instruction. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #63 - December"
  date: "December 11, 2025"
  blog_link: /blog/quarkus-newsletter-63/
  newsletter_link: /newsletter/63/
  summary: "Check out \"Java Meets the Future: How Quarkus Seamlessly Combines Architecture, Performance, and Cloud-Native\" by Holger Tiemeyer to see how Quarkus impressively demonstrates that even an aging ecosystem like Java can always be reinvented to meet the demands of the next technological era. Learn how to build Quarkus application images using Cloud Native Buildpacks and OpenShift Builds with Piotr Minkowski's article; \"Quarkus with Buildpacks and OpenShift Builds\". Learn how to generate, extend, and optimize a Quarkus actuator-style endpoint with build-time processing, runtime beans, and native support by reading \"How to Build a Custom Quarkus Actuator Extension: A Complete Java Developer’s Guide\" by Markus Eisele. Did you know about Roq? A powerful new tool that combines Java and Quarkus. Ok, prep a warm drink and put on some soft music and let's find out why Roq is so cool with the comfort of Quarkus Dev Mode and all its eco-system. Bonus: a touch of TailwindCss to make it look great! Learn more by reading Andy Damevin's article \"Discover Roq, the Quarkus Way for Static Site Generation in Java\". You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #62 - November"
  date: "November 13, 2025"
  blog_link: /blog/quarkus-newsletter-62/
  newsletter_link: /newsletter/62/
  summary: "Discover what most Java developers miss—AI assistants, dynamic Qute templates, auto-refreshing tokens, and reactive magic in \"You’re Only Using Half of Quarkus: 10 Hidden Features That Change Everything\" by Markus Eisele. Farah Juma's blog post \"How to Secure Your A2A Server Agent with Keycloak OAuth2\" shows how to secure an A2A server agent using OAuth2 bearer tokens via Keycloak and shows how to enable an A2A client to automatically obtain and pass the required token in each request. \"Hexagonal Architecture in Java: Structuring Your APIs for Maintainability\" by lostyzen is a complete guide to hexagonal architecture in Java with Quarkus: structure, concrete examples, testing, and best practices for maintainable and scalable APIs. Read about Quarkus's continued focus on native for swift start-up time and low memory footprint in Severin Gehwolf' article, \"Continued Focus on Native\". If you want to test the business logic of your components in isolation, with different configurations and inputs, then QuarkusComponentTest is a good choice. It’s fast, integrated with continuous testing, and extensible. Learn more about by reading Martin Kouba's article \"Quarkus - a component testing update\". Explore Qute’s dynamic include feature in Quarkus 3.26 and learn how to build modular, data-driven dashboards for modern enterprise apps. Learn more in \"Dynamic UI Composition with Quarkus Qute: The Future of Java Frontends\" by Markus Eisele. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #61 - October"
  date: "October 22, 2025"
  blog_link: /blog/quarkus-newsletter-61/
  newsletter_link: /newsletter/61/
  summary: "See how BCE/ECB keeps Java applications clean, testable, and future-proof. With rules that fail the build when you break them in \"Guard Your Code: Enforcing Architecture Boundaries in Quarkus with ArchUnit\" by Markus Eisele. Elder Moraes's \"Building a Web-Searching Agent with Ollama, Langchain4j, and Quarkus\" is a great guide that provides a step-by-step, hands-on tutorial for Java developers to construct a sophisticated AI agent that embodies the new paradigm where the model can autonomously decide it needs more information and knows how to get it. A2A Java SDK 0.3.0.Alpha1 makes it possible to quickly get started with Quarkus and A2A using the latest, more stable version of the A2A protocol. Read \"Getting Started with Quarkus and A2A Java SDK 0.3.0\" by Farah Juma to learn more. Explore some ways to develop, deploy and run applications on AWS Lambda using Quarkus framework with \"How to Develop, Run and Optimize Quarkus Web Application on AWS Lambda\" by Vadym Kazulkin. Java developers need to preserve the qualities we know matter: correctness, security, and maintainability but also need to embrace a new class of technologies that behave very differently from what we’re used to. Learn more about it in \"The Java Developer’s Dilemma: Part 1\" by Markus Eisele. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #60 - September"
  date: "September 26, 2025"
  blog_link: /blog/quarkus-newsletter-60/
  newsletter_link: /newsletter/60/
  summary: "From hidden string pitfalls to emoji-safe endpoints, learn how to handle text correctly in modern Java applications with \"Mastering Unicode in Java: Build World-Ready REST APIs with Quarkus\" by Markus Eisele. Read \"Infusing AI into Your Java applications\" by Don Bourne & Michal Broz to learn how to create a simple RESTful Java AI application that asks a large language model (LLM) to write a short poem based on a topic provided by the application user. Check out Octavio Santana's \"Build a REST API With Just 2 Classes in Java and Quarkus\" to learn how Quarkus enables a full CRUD API with just two classes using Hibernate ORM with Panache. No controllers or repositories needed — just define two classes, and deploy. Read \"Building AI-Powered Applications with LangChain4j and Quarkus\" by Hamid Khanjani to see how Quarkus + LangChain4j lets you build fast, testable, production-ready AI services in Java. Learn how to bridge the gap between generative AI's knowledge and its ability to act within an enterprise, enabling LLMs to interact with business systems. Read \"The Universal Adapter for Enterprise AI: Mastering the MCP with Quarkus and Langchain4j\" by Elder Moraes as a hands-on guide to building an MCP server and a Langchain4j client to enhance system flexibility and maintainability. Check out \"Building local LLM AI-Powered Applications with Quarkus, Ollama and Testcontainers\" by Jonathan Vila López, a complete development guide to build local LLM applications with Ollama and Quarkus and test them with Testcontainers. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #59 - August"
  date: "August 13, 2025"
  blog_link: /blog/quarkus-newsletter-59/
  newsletter_link: /newsletter/59/
  summary: "Learn how to integrate LangChain4j with Quarkus MCP for building intelligent assistants using tools and natural language queries with Omozegie Aziegbe's blog article \"LangChain4j Quarkus MCP Example\". Read \"Create a Java REST API with Quarkus and Eclipse JNoSQL for MongoDB\" by Otavio Santana to learn how to create a RESTful API using Quarkus and integrate it with Eclipse JNoSQL to work with MongoDB. Learn how to create a simple RESTful Java AI application that asks a large language model (LLM) to write a short poem based on a topic provided by the application user in Laura Cowen's article \"Create your first AI Java application with Quarkus and LangChain4j\". \"Building a CLI with Quarkus, Kotlin and GraalVM\" by Maarten Mulders is a great guide that covers project setup, dependency injection, PicoCLI integration, and proven practices for developer productivity, automation, and modern software development. Learn out to combine K-Means clustering, a local LLM, and Quarkus to transform image uploads into beautiful, named color palettes with \"Color Whisperer: Build a Java App That Sees the Soul of Your Images\" by Markus Eisele. See how to create a summarizing agent that speaks the A2A protocol and harnesses local or cloud LLMs in Markus Eisele's \"Build Your First AI Agent in Java: Quarkus, Langchain4j, and the A2A SDK\". You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #58 - July"
  date: "July 14, 2025"
  blog_link: /blog/quarkus-newsletter-58/
  newsletter_link: /newsletter/58/
  summary: "Discover more about the launch of the Agent2Agent (A2A) Java SDK, contributed by the WildFly and the Quarkus communities. Learn how to build a Model Context Protocol server and client using Quarkus and LangChain4J in “Using the Model Context Protocol With Quarkus and Langchain4j” by Vishal Shanbhag & Saajan Nagendra. Make sure you read “AI Tool Calling with Quarkus LangChain4j” by piotr.minkowski to explore Quarkus LangChain4j AI support's integration with chat models, focusing on \"tool calling\" (function calling), an AI application pattern that enhances models via API/external tool interaction. See how to trace microservice calls across network boundaries using Quarkus, REST clients, and Jaeger in Markus Eisele’s post “The Distributed Dragon Forge: A Hands-On OpenTelemetry Adventure with Quarkus”. Finally, check out Loïc Mathieu’s article to learn how to build a chatbot with Google Gemini Vertex AI and Quarkus Comments Feed. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #57 - June"
  date: "June 12, 2025"
  blog_link: /blog/quarkus-newsletter-57/
  newsletter_link: /newsletter/57/
  summary: "Quarkus MCP Server is blazing a trail as the first Java MCP server with Streamable HTTP support—unlocking new possibilities for developers. Read more about in the blog post \"Quarkus MCP Server: The First Java Server SDK to Support Streamable HTTP!\" by Max Rydahl Andersen. Learn how Quarkus MCP Client can use access tokens to access secure MCP servers in Sergey Beryozkin's blog post \"Use Quarkus MCP client to access secure MCP HTTP servers\". Leverage ChatGPT and existing Maven skills, to rapidly develop and deploy a new API with Quarkus. Ease the learning curve and achieving quick validation on Heroku. See how in \"How To Introduce a New API Quickly Using Quarkus and ChatGPT\" by John Vester. Explore LLM guardrails, why they matter, and how you can effectively implement them to ensure safe and trustworthy AI interactions in \"Ensuring Safe and Reliable AI Interactions with LLM Guardrails\" by Brian Vermeer. Learn about Prasbanth's first experience to see how the Java ecosystem is adapting to the world of cloud-native applications — and how that experience left him motivated to continue this journey in \"From Traditional Java to Cloud-Native with Quarkus: My First Boston Java Users Meetup Experience\". You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #56 - May"
  date: "May 13, 2025"
  blog_link: /blog/quarkus-newsletter-56/
  newsletter_link: /newsletter/56/
  summary: "Read \"AI-Powered Form Wizards: Chat, Click, Done\" By Loïc Magnette to discover how Conversational AI Forms transform static forms into dynamic, guided experiences that boost data quality and ease of use. Learn how MCP clients can access Quarkus MCP SSE servers with access tokens in \"Getting ready for secure MCP with Quarkus MCP Server\" by Sergey Beryozkin. Markus Eisele's \"Deploy Java Like a Pro: Your First Quarkus App on OpenShift in Minutes\" is a fun, hands-on guide for Java developers to build a REST API with Quarkus, PostgreSQL, and deploy it to OpenShift Developer Sandbox with no Kubernetes expertise required. Check out \"Quarkus 3 application on AWS Lambda- Part 1\" by Vadym Kazulkin for an introduction to the sample application and first Lambda performance measurements. Take a look back to see the way forward in \"Why Standards Matter More Today: From Fear of Lock-In to Foundations for Choice\" by Markus Eisele. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #55 - April"
  date: "April 11, 2025"
  blog_link: /blog/quarkus-newsletter-55/
  newsletter_link: /newsletter/55/
  summary: "Max Rydahl Andersen discusses Red Hat's Middleware engineering moving to IBM and how Quarkus remains an open-source project supported by a vibrant global community in his blog post \"Quarkus & Red Hat's evolving middleware strategy\". Jeff Beck's blog post \"The Quarkus Edge: How Real Customers Achieve Speed, Performance, and Agility\" that highlights real-world success stories from telco, transportation, and banking industries, showcasing how enterprises use Quarkus to achieve massive performance gains, lower costs, and improved developer productivity in cloud-native applications. Get a hands-on look at Quarkus' developer experience advantages, focusing on coding constructs, testing, and configuration and not just speed in \"Ten Reasons for Spring Developers to Explore Quarkus\" by Markus Eisele. By Markus Eisele shows Quarkus is not simply \"catching up\" to Spring Boot in AI integration; it's carving its own path, leveraging its cloud-native foundation and community agility to offer a compelling platform for building modern, high-performance AI applications in \"Quarkus: A Lean and Agile Foundation for Enterprise Generative AI\". Check out this blog post to learn how Quarkus LangChain4j and OIDC can help to create secure agentic Google Gemini AI services in \"Secure Agentic AI with Quarkus and Google Gemini\" by Sergey Beryozkin. Jianguo_Ma shows you how to observe Red Hat Quarkus applications with Azure Application Insights using OpenTelemetry. Read \"Migrating from AWS Lambda to EKS: Our Journey and Key Learnings\" by Asim Naqvi to see the details their migration journey from AWS Lambda to EKS, the challenges we faced, our architectural decisions, and the impact of moving to Kubernetes (EKS) and Quarkus. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #54 - March"
  date: "March 12, 2025"
  blog_link: /blog/quarkus-newsletter-54/
  newsletter_link: /newsletter/54/
  summary: "Make sure you read Mario Fusco's two-part blog about Agentic AI with Quarkus, where he discusses common workflows and agentic AI patterns and architectures, with practical examples using Quarkus and LangChain4j. Learn about the power of intelligent applications by combining the robustness of Java, the efficiency of Quarkus, and the advanced capabilities of RAG in a great article by Daniel Oh. Emil Lefkof gives a real-world example of how LangChain4j and AI can be leveraged to automatically extract structured metadata from PDF documents. Leveraging the combination of LangChain4j and Google Gemini AI proves to be a powerful approach for automating document analysis workflows. \"Performance & Productivity: Rethinking Java Dependencies for the Cloud Era\" by Markus Eisele discusses how Quarkus extensions are curated, lightweight, and optimized for microservices and serverless. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #53 - February"
  date: "February 11, 2025"
  blog_link: /blog/quarkus-newsletter-53/
  newsletter_link: /newsletter/53/
  summary: "Be sure to read Max Rydahl Andersen's blog post that introduces the Model Context Protocol servers project which provides a set of MCP servers implemented using Quarkus and Java. Starting with JDBC, filesystem and JavaFX. Don't miss transcript of Holly's QCon talk \"Zero Waste, Radical Magic, and Italian Graft – Quarkus Efficiency Secrets\", where she discusses some of the technical underpinnings of Quarkus’s efficiency, providing advice for those using or considering Quarkus. Clement Escoffier also has a great blog post that discusses the new predictable cadence for LTS micro-releases. \"Quarkus Redis: Monitoring Pool Size for Backpressure\" by 0x2e Tech provides a comprehensive approach for a robust solution for monitoring and managing your Redis connection pool in a Quarkus application. Delve into understanding how to debug Quarkus apps and effectively troubleshoot issues in your Quarkus applications with \"Debug Quarkus Apps Example\" by Yatin Batra. Learn how the Couchbase Quarkus SDK 1.0 is now in General Availability and production-ready with seamless integration, GraalVM native image support, and enhanced developer productivity in the article by Emilien Bevierre and Vishal Dhiman. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #52 - January"
  date: "January 14, 2025"
  blog_link: /blog/quarkus-newsletter-52/
  newsletter_link: /newsletter/52/
  summary: "Explore how to combine Quarkus, a modern Java framework optimized for cloud-native applications, with Ollama, a platform for running AI models locally with Jonathan Vila's article \"Building local LLM AI-Powered Applications with Quarkus, Ollama and Testcontainers\". Long Term Support (LTS) releases are designed for users who want to keep a given version for a longer period of time instead of following our monthly release pace. Quarkus 3.20 will be our next LTS version planned for release in late March. Read more about it in the blog post \"Our next LTS will be Quarkus 3.20\" from Guillaume Smet. Customizing your test resource manager and using a unified configuration, you can eliminate conflicts between the containers used by Liquibase and your application. Learn how in \"Resolving Issues with Quarkus Tests, Test Containers, and Liquibase Integration\" by tempmailgenerator on Reddit. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #51 - December"
  date: "December 12, 2024"
  blog_link: /blog/quarkus-newsletter-51/
  newsletter_link: /newsletter/51/
  summary: "\"Quarkus has surpassed the 1,000 contributor milestone\" by Dimitrios Andreadis will explore the evolution and future of Quarkus, Red Hat’s next-generation Java framework designed to optimize applications for cloud-native environments. \"Java Quarkus LangChain4j – Building a Chatbot\" by Bhagvan Kommadi will guide you through leveraging two powerful tools — Quarkus and LangChain4j — to create chatbots that are not only efficient and scalable but also capable of understanding and generating human-like responses. \"Testing Apache Camel Routes with Testcontainers\" by Andras Fejes describes how Apache Camel and Testcontainers combine EIPs for integration and Testcontainers for robust, automated testing. Hamid Khanjani's \"Hibernate Reactive with Panache: The Quarkus-Powered ORM Revolution for Reactive Java Applications and Kubernetes\" describes how when Hibernate is combined with Panache, an intuitive and declarative ORM layer from Quarkus, it becomes a game-changer for Java developers. Explore different choices available for developing a new Quarkus application in \"Getting Started with Quarkus: A Guide to Application Creation\" by Jagnya Datta Panigrahi. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #50 - November"
  date: "November 12, 2024"
  blog_link: /blog/quarkus-newsletter-50/
  newsletter_link: /newsletter/50/
  summary: "Explore building a Quarkus application using Tekton, which is the upstream project on which OpenShift Pipelines is based on in \"Building a Quarkus Application using OpenShift Pipelines\" by Stephen Nimmo. Clement Escoffier's blog post \"Strengthening the Release Process for Quarkiverse and SmallRye\" outlines a corrected vulnerability in the SmallRye release process and a more secure release pipeline for SmallRye and Quarkiverse repositories. Learn about organizing a microservices codebase with Beans, EJB concepts, and the Repository pattern and touch upon automated testing using REST Assured and Quarkus JUnit5 in \"Organizing Microservices with EJB, Beans, and Testing in Quarkus\" by @Harsh. Read \"Build containerized applications for Amazon DocumentDB that run on Amazon ECS on AWS Fargate\" by Sourav Biswas and Varma Gottumukkala, to explore the fundamentals of building containerized applications for Amazon DocumentDB using Quarkus with the Panache ORM library. Clojure can be integrated into a Quarkus app to create dynamic routes easily. By connecting the two ecosystems, a basic routing system is set up. Explore more possibilities with Clojure and Quarkus on this foundation in \"Calling Clojure from Java using a real example (Clojure + Quarkus)\" by Gustavo Camargo. SmallRye OpenAPI in Quarkus is like having an intelligent intern managing API documentation as you code. Check out \"The Power of SmallRye OpenAPI in Quarkus: A Developer's Guide to Effortless API Documentation\" by suddo to learn how to implement this feature. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #49 - October"
  date: "October 17, 2024"
  blog_link: /blog/quarkus-newsletter-49/
  newsletter_link: /newsletter/49/
  summary: "Explore how the combination of Quarkus and LangChain4J boosts productivity and efficiency in developing Java-based AI systems as well as understanding the key concepts underlying the development of such applications in \"Leveraging Quarkus and LangChain4j\" by Thiago dos Santos Hora. Read \"Enhancing the Quarkus developer experience: New updates for IntelliJ and VS Code tools\" by Mohit Suman & Angelo Zerr for information on the latest releases of Quarkus Tools for IntelliJ 2.0.2 and Quarkus Tools for Visual Studio Code 1.18.1 that deliver significant enhancements to support Quarkus and Qute, making development smoother. Check out Yatin Batra's article \"Quarkus Citrus Test Tutorial\" to Learn how to implement and run integration tests using Quarkus with Citrus framework for effective testing. \"Effective Project Structuring for Microservices with Quarkus\" by Ivelin Yanev is a great way to learn the key to leveraging Quarkus effectively by understanding how to structure your project correctly. Kostiantyn Ivanov wrote a great tutorial, \"Connecting to Elasticsearch Using Quarkus\" the helps you explore how to integrate Quarkus with Elasticsearch, a well-known full-text search engine and NoSQL datastore. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #48 - September"
  date: "September 12, 2024"
  blog_link: /blog/quarkus-newsletter-48/
  newsletter_link: /newsletter/48/
  summary: "\"Harnessing Automatic Setup and Integration with Quarkus Dev Services for Efficient Development\" by Ivelin Yanev to see the simplicity and power of Quarkus to encourage experimentation, quicker iterations, and ultimately a faster development cycle. Learn how to to make the Quarkus build goal cacheable with minimal modifications to the Maven build configuration, reusing outputs from previous builds to save time in Jérôme Prinet's article \"Accelerate your Quarkus Maven builds with Develocity Build Cache\". Read \"Implementing a Quarkus REST API using PostgreSQL as Database\" by Ivan Franchin as a step-by-step guide on how to implement the Movie API, a Quarkus application that uses PostgreSQL as database Explore how to create a dummy REST API in Quarkus and demonstrate various methods to consume it using different clients by reading \"How to Consume REST API in Quarkus\" by Alexandru Borza. Learn how to get the most out of your serialization performance in \"Leveraging Quarkus build-time metaprogramming capabilities to improve Jackson's serialization performance\" by Mario Fusco. Learn about the creation of the Quarkus JDiameter extension in Eddie Carpenter's blog post, \"Revolutionizing Telecom Microservice - Modernizing JDiameter with Quarkus\". You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #47 - August"
  date: "August 12, 2024"
  blog_link: /blog/quarkus-newsletter-47/
  newsletter_link: /newsletter/47/
  summary: "Quarkus recently announced its intention to join the Commhaus Foundation to further solidify its commitment to open-source development and enterprise adoption. Learn more by reading blog posts from Jeff Beck and Max Rydahl Andersen. Explore Hibernate Reactive and Quarkus in-depth by building a reactive bank deposit application from scratch with this great tutorial \"Hibernate Reactive and Quarkus\" by Reza Ganji & Liam Williams. The article, \"Testing a Quarkus Application Using Testcontainers for Service Dependencies\" by Paul Pearson & Liam Williams will allow you to see the power of using Testcontainers to help test a Quarkus application using ‘live’ service-to-service testing. Read \"A Guide to Micrometer in Quarkus\" by Yatin Batra to explore and gain a comprehensive understanding of Micrometers in Quarkus. Discover some tips and pointers about deploying Quarkus on AWS in this \"Deploying native Quarkus REST API's in AWS Lambda\" by Patryk Szczypień. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #46 - July"
  date: "July 12, 2024"
  blog_link: /blog/quarkus-newsletter-46/
  newsletter_link: /newsletter/46/
  summary: "Check out \"Crafting a Local RAG application with Quarkus\" by Clement Escoffier to learn how to build an AI-infused chatbot application using Quarkus, LangChain4j, Infinispan, and the Granite LLM. See how to create an entirely local solution, eliminating the need for any cloud services, including the LLM. Read Hantsy's \"Integrating Jakarta Data with Quarkus\" to see how to utilize the existing Hibernate ORM extension to integrate Jakarta Data with Quarkus. Don't miss \"Stateful and reactive stream processing applications with Apache Kafka, Quarkus, and Angular on OpenShift\" by Hans-Peter Grahsl and learn how to build an end-to-end reactive stream processing application using Apache Kafka as an event streaming platform, Quarkus for your backend, and a frontend written in Angular. In the end, you'll deploy all three containerized applications on the Developer Sandbox for Red Hat OpenShift. \"4 ways to deploy Quarkus applications in OpenShift Container Platform 4\" by Francisco De Melo Junior and Alexander Barbosa Ayala describes the BuildConfig process for Quarkus applications in Red Hat OpenShift Container Platform 4. You will also see the latest Quarkus Insights episodes, top tweets/discussions and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #45 - June"
  date: "June 12, 2024"
  blog_link: /blog/quarkus-newsletter-45/
  newsletter_link: /newsletter/45/
  summary: "The June newsletter includes some great new articles. Discover the simple and easy way to quickly get up and running with containerized LLMs and AI-infused Quarkus applications in Java with \"GenAI in Java With Merlinite, Quarkus, and Podman Desktop AI Lab\" by Markus Eisele. Read \"Quarkus Java framework adds dev extensions for observability\" by Paul Krill to learn about the latest update to the Kubernetes-native Java stack introduces dev extensions for Grafana, Jaeger, OTel, and VictoriaMetrics. Reza Ganji's article: \"The Magic of Quarkus With Vert.x in Reactive Programming\" will explore reactive programming in Quarkus, along with detailed insights and practical examples in Java to illustrate its transformative capabilities. Follow this step-by-step guide on deploying the Serverless Quarkus Book app in Knative Minikube (Kubernetes) in \"Deploying Serverless Quarkus JPA App in Knative Minikube (Kubernetes)\" by Ivan Franchin You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #44 - May"
  date: "May 15, 2024"
  blog_link: /blog/quarkus-newsletter-44/
  newsletter_link: /newsletter/44/
  summary: "Get the May newseltter and check out these great articles. \"Revolutionizing time tracking: how Quarkus transformed our backend development\" by Dusan Odalovic describes how GRAN Software Solutions used Quarkus to help create a time tracking application to meet their unique specific requirements. Understand how to breakdown a monolith into Quarkus based microservices with \"Modernizing Pedal: Breaking down a Java monolith into Quarkus microservices\" by Yashwanth Maheshwaram and Ian Lawson. Evren Tam's article \"Using MapStruct within Quarkus\" to learn mapping from entities to DTOs and vice versa is always required within multi-layered applications for transferring data between services/processes. Kubernetes: Deployment Quarkus with Databases by Daniel S. Blanco is a follow up article that describes how deploy two different containers and establish a connection between them. Thiago dos Santos Hora wrote \"Role-Based Access Control in Quarkus\", a tutorial that discusses Role-Based Access Control (RBAC) and how to implement this functionality using Quarkus. We've also released some sweet desktop wallpapers for the communithy to use. Get them today! You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #43 - April"
  date: "April 16, 2024"
  blog_link: /blog/quarkus-newsletter-43/
  newsletter_link: /newsletter/43/
  summary: "Check out these great articles in the April newsletter. \"The Power of LLMs in Java: Leveraging Quarkus and LangChain4j\" by Nicolas Duminil attempts to demystify the use of LLMs in Java, with Quarkus and LangChain4j, across a ludic and hopefully original project. Learn about some challenges running several simultaneous Quarkus app containers on your machine with the Quarkus’ remote development mode activated presents in \"Multiplying The Developer Joy: Multiple Quarkus Containers + Simultaneous Remote Development Sessions\" by Rustam Mehmandarov. See how to configure Quarkus OIDC with Google Cloud credentials in \"OIDC with Google & Quarkus\" by Prabodh Agarwal. \"An Open Plea to the Quarkus Team\" by Preslav Rachev asks us to rethink the way the Java community sees Quarkus the framework. \"Getting started with MongoDB and Quarkus: Beyond the basics\" by Hans-Peter Grahsl is Part 2 of is article on how to Connect your Quarkus application to a fully-managed MongoDB database instance. Learn how to lower the level of a logger in Quarkus to better understand when something goes wrong and how to fix it with Gwenneg Lepage's \"Changing the Quarkus loggers level from Unleash\" article. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #42 - March"
  date: "March 13, 2024"
  blog_link: /blog/quarkus-newsletter-42/
  newsletter_link: /newsletter/42/
  summary: "Read this great article \"How to integrate Quarkus applications with OpenShift AI\" by Clement Escoffier to discover how to integrate cutting-edge OpenShift AI capabilities into your Java applications using the OpenShift AI integration with Quarkus. Learn how to create a Java application that uses AI and large-language models (LLMs) by integrating the LangChain4j library and Red Hat build of Quarkus in \"How to use LLMs in Java with LangChain4j and Quarkus\" by Helber Belmiro. Nikhil Mungale wrote \"Connect a Quarkus app to an external SQL Server database\" to show how to use an external database with Quarkus and link an example application to an external Microsoft SQL Server database in this tutorial. Learn how to integrate Oracle NoSQL with Quarkus using JNoSQL for seamless cloud-native application development with Otavio Santana's article \"Unlocking the Power of Oracle NoSQL With Quarkus: Seamless Integration for Cloud-Age Applications\". \"CRUDing NoSQL Data With Quarkus, Part One: MongoDB\" by Nicolas Duminil demonstrates how Quarkus, the supersonic, subatomic Java stack, greatly simplifies the NoSQL data persistence. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #41 - February"
  date: "February 13, 2024"
  blog_link: /blog/quarkus-newsletter-41/
  newsletter_link: /newsletter/41/
  summary: "Learn how to create a Quarkus extension that provides three features that notify an API regarding the application's starting status, offers a implementation class created with Gizmo, and count the number of methods using Jandex in \"Developing a Quarkus Extension\" by Matheus Cruz. Check out \"Serverless on Azure Function with Quarkus\" by Piotr Minkowski to see how to create and run serverless apps on Azure Function using the Quarkus Funqy extension. Learn how to use Wiremock with Quarkus to performing quality testing of your code with \"Wiremock & Quarkus: How to configure it\" by Daniel S. Blanco. Read \"Connect a Quarkus app to an external SQL Server database\" by Nikhil Mungale to learn how to use an external database with Quarkus and link an example application to an external Microsoft SQL Server database in this tutorial. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #40 - January"
  date: "January 11, 2024"
  blog_link: /blog/quarkus-newsletter-40/
  newsletter_link: /newsletter/40/
  summary: "Learn the process of scaffolding and building a Quarkus extension in In \"Quarkus: Greener, Better, Faster, Stronger\" by Kosmik. Read about the LangChain4j extension based on the LangChain4J library, the Java re-implementation of the langchain library in \"Quarkus LangChain4J Extension Allows Developers to Integrate LLMs in Their Quarkus Applications\" by Olimpiu Pop. \"Case Study: Modernizing Legacy Java EE 6 with Quarkus and Microsoft Services\" by Armel outlines the meticulous steps taken to migrate the application to Java 11, leveraging the Quarkus framework for containerization and harnessing Microsoft services for enhanced development and deployment. \"Connect a Quarkus app to an external PostgreSQL database\" by Nikhil Mungale is a great guide to help integrate Pedal’s external PostgreSQL database with one of its Quarkus microservices deployed on Red Hat OpenShift. \"Quarkus Framework Overview and Comparison with Spring Boot\" by Andrii Biehunov wrote a great overview of the Quarkus framework and a comparison with Spring Boot. Explore how to deploy a Quarkus application to Elastic Beanstalk and take a closer look at some of the key benefits and best practices for using these two technologies together in Ricardo Mello's \"Deploying a Quarkus Application to AWS Elastic Beanstalk\". You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #39 - December"
  date: "December 12, 2023"
  blog_link: /blog/quarkus-newsletter-39/
  newsletter_link: /newsletter/39/
  summary: "Large language models (LLMs) are reshaping the world of software, altering the way we interact with users and develop business logic. See how to use the just released quarkus-langchain4j 0.1 extension to integrate LLMs in Quarkus applications. Additionally, learn how Quarkus integrates the virtual thread for Java developers to run blocking applications with a single @RunOnVirtualThread annotation in \"Quarkus 3: The Future of Java Microservices With Virtual Threads and Beyond\" by Daniel Oh. He also wrote another great article, \"Demystifying Virtual Thread Performance: Unveiling the Truth Beyond the Buzz\" where you can learn how virtual threads can provide high enough performance and resource efficiency based on your concurrency goal but also let you have a simple development model. Read \"Revolutionize Data Management: Unleashing the Potential of Quarkus and HarperDB for Maximum Efficiency\" by the Java Code Geeks to explore the seamless integration of Quarkus with HarperDB, a powerful and high-performance database solution. Build a MongoDB-powered RESTful app with Quarkus and Eclipse JNoSQL: generate, configure, create entities, implement services, and expose API by reading \"Building a MongoDB-Powered RESTful Application With Quarkus and Eclipse JNoSQL\" by Otavio Santana. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #38 - November"
  date: "November 14, 2023"
  blog_link: /blog/quarkus-newsletter-38/
  newsletter_link: /newsletter/38/
  summary: "In the world of software development, innovation often arrives in the form of powerful tools that transform the way we build applications - enter Quarkus, a development platform that's reshaping the Java landscape. Learn more about it in \"Get started with Quarkus and JPAStreamer \" by Julia Gustafsson. The Red Hat build of Quarkus 3.2 features an enriched UI for Java development and the new Pact tool for contract-based testing. Learn more about it in \"Red Hat Quarkus Java stack spruces up the dev UI\" by Paul Krill. \"Demystifying Quarkus Extension Development: Jandex vs. AdditionalBeanBuildItem\" by Ivelin Yanev explains the differences between these approaches, offering insights into their roles, applications, and the intricate interplay between them. Gain a clear understanding of how to wield these tools effectively in your Quarkus extensions. Learn how to use Scaffold to quickly modify your code and redeploy it in your Kubernetes cluster with \"Skaffold with Quarkus and Kubernetes\" by Ronald Koster. Check out the results of the analysis to attribute the size increase to specific changes in Mandrel’s code base with \"Exploring why native executables produced with Mandrel 23.0 are bigger than those produced with Mandrel 22.3\" by Foivos Zakkak. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #37 - October"
  date: "October 10, 2023"
  blog_link: /blog/quarkus-newsletter-37/
  newsletter_link: /newsletter/37/
  summary: "Read \"Integrate your Quarkus application with GPT4All\" by Alex Soto Bueno to explore how to integrate GPT4All into a Quarkus application so that you can query this service and return a response without any external resources. Go behind the scenes to learn how to create a CRUD application using virtual threads in Quarkus with Clement Escoffier's blog post \"Writing CRUD applications using virtual threads\". Read \"Observability in Quarkus 3\" by Bruno Baptista to learn about Quarkus 3.3's many improvements to its main observability related extensions. Check out \"Deploy a Quarkus application to the Developer Sandbox with JetBrains IDEA\" by Andre Dietisheim to get to know how the JetBrains plugin assists you in deploying a Quarkus application as well as its unique features. Explore the testing possibilities offered by Quarkus and present concepts like dependency management and injection, mocking, profile configuration, and more specific things like Quarkus annotations and testing a native executable in baeldung's article, \"Testing Quarkus Applications\". Learn about the CodeShift hackathon that brings together developers from all over the world to demonstrate their skills and creativity using Red Hat's cloud-native application development platform. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #36 - September"
  date: "September 15, 2023"
  blog_link: /blog/quarkus-newsletter-36/
  newsletter_link: /newsletter/36/
  summary: "Explore how we can use the Testcontainers Desktop app while building a Quarkus application by reading \"Joyful Quarkus Application Development using Testcontainers Desktop\" by Siva Katamreddy. Extensions can significantly increase the application's performance, help developers be more productive while developing their applications, integrate complex dependencies much easier, and simplify the application's source code. Kevin Dubois shows you how to tap into this superpower in \"Quarkus extensions give Java dependencies superpowers\". Explore how to integrate OpenAI API with Quarkus in \"Generate AI-based Images with Quarkus and OpenAI DALL.E\" by Antonio Perrone. In \"How to use Cryostat agent to profile Java workloads\", Andrew Azores gives a brief overview of what the Cryostat agent does, reasons to instrument your containerized applications with the Cryostat agent, and finally, an example of how to include the Cryostat agent into a Quarkus application. In today's data-driven world, the ability to seamlessly integrate and manage data from diverse sources is crucial for the success of modern applications. Otavio Santana & Michael Relich shows you how in \"Leveraging Eclipse JNoSQL 1.0.0: Quarkus Integration and Building a Pet-Friendly REST API\". \"Java Quarkus application working with IRIS\" by Dmitry Maslennikov creates an example of an application on Java working with Hibernate dialect for IRIS, wanted to use RealWorld application, and found realization for Quarkus. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #35 - August"
  date: "August 14, 2023"
  blog_link: /blog/quarkus-newsletter-35/
  newsletter_link: /newsletter/35/
  summary: "Read Ladislav Thon's article \"On the Road to CDI Compatibility\" to learn about the long road to make Quarkus compatible with CDI Lite. An Elsevier software engineer (Neil Stevens) writes about how to use Quarkus to improve Java functions with AWS Lambda in \"Elsevier Tech: Writing a native Java Lambda using Quarkus\". Learn how to quickly deploy Red Hat Quarkus on Azure Kubernetes Service (AKS) with a simple CRUD application in Karl Erickson, Delora Bradish, Ed Burns, and Daniel Oh's article \"Deploy a Java application with Quarkus on an Azure Kubernetes Service cluster\". Otavio Santana shows you how to build a MongoDB-powered RESTful app with Quarkus and Eclipse JNoSQL: generate, configure, create entities, implement services, and expose API in \"Building a MongoDB-Powered RESTful Application With Quarkus and Eclipse JNoSQL\". \"How to send notifications from a Quarkus app to a Telegram Chatbot using Java and the Oracle Database 23c Free — Developer Release\" by Juarez Junior will explore how to use the Telegram Bot API and Quarkus to send message notifications from a Java application to your Telegram Chatbot using the Telegram API. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #34 - July"
  date: "July 13, 2023"
  blog_link: /blog/quarkus-newsletter-34/
  newsletter_link: /newsletter/34/
  summary: "Read \"Quarkus 3.2.0.Final released - New security features, @QuarkusComponentTest\" by Guillaume Smet\" to learn about major changes like; various new security features, the ability to test CDI components with @QuarkusComponentTest and new build time analytics. Kevin Dubois' article \"Managing Java containers with Quarkus and Podman Desktop\" shows how to build Java containers using Quarkus, a modern cloud-native Java stack, and Podman Desktop, a desktop solution for managing containers locally. Roberto Cortez was kind enough to share his experience on 11 more Java-related questions in \"Learn from Java Champion Roberto Cortez: Quarkus and Spring: Cloud-Native Java Development\" by Dreamix Team. Start using JFR to debug, profile, and monitor Quarkus native executables after reading Robert Toyonaga's article; \"How to monitor Quarkus native executables with JFR\". \"Explore a new way of testing CDI components in Quarkus\" by Martin Kouba goes in depth on an experimental feature to ease the testing of CDI components and mocking of their dependencies. Don't miss \"Building a MongoDB-Powered RESTful Application With Quarkus and Eclipse JNoSQL\" by Otavio Santana. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #33 - June"
  date: "June 13, 2023"
  blog_link: /blog/quarkus-newsletter-33/
  newsletter_link: /newsletter/33/
  summary: "Check out the June Newsletter. Read \"A Guide to the Quarkus 3 Azure Functions Extension: Bootstrap Java Microservices with Ease\" by Daniel Oh & Erik Costlow and to learn how Quarkus integrates Java microservices into Azure Functions with an improved developer experience. Check out \"Quarkus: Java revisited!\" by Willem Meints to go through the steps of creating a new Quarkus project, exploring its extensions and building business logic with Domain Driven Design (DDD) principles. See how to design and perform contract testing on Kubernetes with Microcks, with \"Contract Testing on Kubernetes with Microcks\" by Piotr Minkowski. Learn how to use Ansible to build and deploy a Quarkus application in the article \"Automate your Quarkus deployment using Ansible\" by Pelisse Romain. See how to integrate Keycloak’s RBAC capabilities into cloud-native microservices for security with a step-by-step tutorial by Daniel Oh. Learn why the Ministry of Economy and Finance (MEF) of Uruguay chose Quarkus to create a scalable reference architecture that enables SIIF to evolve as part of the modernization process with a great user story by Fabricio Gregorio. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #32 - May"
  date: "May 15, 2023"
  blog_link: /blog/quarkus-newsletter-32/
  newsletter_link: /newsletter/32/
  summary: "The May newsletter has been sent. Get a deep dive into the Quarkus 3 release. Learn how to implement built-in and custom Role-Based Access Control (RBAC) in Quarkus to ensure secure REST API access with the \"Implementing RBAC in Quarkus\" article by Aashreya Shankar. Read about \"Dynamic Data Processing Using Serverless Java With Quarkus on AWS Lambda\" in this two-part series by Daniel Oh. Piotr Minkowski shows how to create contract tests for Quarkus apps using Pact. Felipe Henrique Gross Windmoller has a great demonstration project that shows how to configure Transport Layer Security (TLS) on Quarkus server and Quarkus client applications. Olimpiu Pop goes into detail Holly Cummins's presentation at Devoxx UK: \"How Would the Business Benefit from Your Greener Java Application?\" You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #31 - April"
  date: "April 12, 2023"
  blog_link: /blog/quarkus-newsletter-31/
  newsletter_link: /newsletter/31/
  summary: "It's time for the April Newsletter. Read Willem Meints's article \"Quarkus: Jave revisited!\" where shares his experience with Java using Quarkus after a long hiatus. Learn why Sebastian Daschner thinks Quarkus is a great choice for Enterprise Java in his great video. Learn how to deploy a Quarkus application to Elastic Beanstalk and take a closer look at some of the key benefits and best practices for using these two technologies together in Ricardo Mello's great article. Check out Guillaume Smet's blog post about the Quarkus 3.0.0.CR1 release. We return to Ricardo Mello with a three part look at Quarkus + Angular with Keycloak. These three articles aim to delve into the authentication mechanism of Keycloak, and the creation of a daily-quotes application using Angular + Quarkus. Experience a great learning module from Antonio Goncalves \"Deploy a Quarkus application to Azure Container Apps\" where you will create a Quarkus application, connect it to a PostgreSQL database, and then deploy to Azure Container Apps. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #30 - March"
  date: "March 14, 2023"
  blog_link: /blog/quarkus-newsletter-30/
  newsletter_link: /newsletter/30/
  summary: "It's time for the March newletter so you can read the latest articles, blogs and insights on Quarkus. Get a deeper understanding of what developers can expect in the final version 3.0 with this InfoQ article \"Road to Quarkus 3: Bets on the Flow API for Mutiny 2.0, Updates to Jakarta Namespace and More\" by Olimpiu Pop. Explore the capabilities of Quarkus and find out how Quarkus helps Java to meet evolving needs with \"Supersonic Subatomic Java with Quarkus\" by Akila Weeratunga. Learn what Eclipse JKube Remote Development is and how it can help developers build Kubernetes-native applications with Quarkus in Eric Deandrea's article, \"Kubernetes-Native Development With Quarkus and Eclipse JKube\". Delve into the Funqy extension of the Quarkus framework with baudlung. Explore the significance of the terms \"native\" and \"reactive\" and why they have become so essential int Ashok Gudise's blog \"Think Reactive and Native With Quarkus, Kotlin, and GraphQL\". Learn how the open source library JPAStreamer makes the process of writing Hibernate queries more intuitive and less time-consuming, while leaving your existing codebase intact in Julia Gustafsson's article \"Express Hibernate Queries as Type-Safe Java Streams\". You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #29 - February"
  date: "February 13, 2023"
  blog_link: /blog/quarkus-newsletter-29/
  newsletter_link: /newsletter/29/
  summary: "Read the February newletter to get the latest articles, blogs and insights on Quarkus. Read \"Deploy serverless Java apps with Quarkus on Azure Functions\" to learn about Quarkus Funqy and its built-in support for the Azure Functions HTTP trigger for Java by Glenn Gailey, Christopher McClister, Daniel Oh, Carolyn McSharry, and Ed Burns. Sascha Moellering's \"How to deploy your Quarkus application to Amazon EK\" will show you how the Quarkus stack and additional extensions can be used to easily develop applications, compile them natively with GraalVM, package them in container images, and deploy them to an Amazon Elastic Kubernetes Service (Amazon EKS) cluster. Get an overview of the data streaming platform DataCater, discusses how we moved from Scala Play! and Kafka Streams to Quarkus, and presents why we think that Quarkus is an exceptional framework for developing cloud-native Java applications with Stefan Sprenger's article \"DataCater uses Quarkus to make Data Streaming more accessible\". Piotr Minkowski will show you how to build advanced testing scenarios with Quarkus in \"Advanced Testing with Quarkus\". You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #28 - January"
  date: "January 13, 2023"
  blog_link: /blog/quarkus-newsletter-28/
  newsletter_link: /newsletter/28/
  summary: "A fresh new year is a perfect time for some fresh new articles in the Quarkus Newsletter. \"Fine-grained authorization for Quarkus microservices\" by Raffaele Spazzoli is a great article describing a solution we call fine-grained authorization and uses Quarkus to implement Relationship-Based Access Control (ReBAC) in the manner of Google Zanzibar. William Siqueiria, of the KIE team, announces the release of the \"Dashbuilder Quarkus\" extension where you can render dashboards directly in your Quarkus app. Markus Paulo has a great article (in Portuguese) on how to create a simple application using Quarkus and publish it on the Fly.io service. Kenneth Kogi has a cool guide taking you through building microservices with Quarkus. Check out Vadym Kazulkin's latest installment of his series \"Measuring Java 11 Lambda cold starts with SnapStart - Part 3 Using Quarkus Framework\" and learn to measure the performance of SnapStart using Quarkus. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #27 - December"
  date: "December 15, 2022"
  blog_link: /blog/quarkus-newsletter-27/
  newsletter_link: /newsletter/27/
  summary: "The year is fast coming to a close so it's time for the December newsletter! Learn some common inner-loop development cycle challenges and solutions in Eric Deandrea's \"Kubernetes-native inner loop development with Quarkus\" article. Find out Pierre Guimon's approach for migrating a substantial Spring boot code base application to Quarkus in \"Migrating a Spring Boot application to Quarkus\". Learn more about \"Quarkus support for AWS Lambda SnapStart\" by Shaaf Syed and \"Quarkus Shardingsphere Jdbc\" by Zhen Feng. Check out a cool tutorial that walks you through the process of building, configuring, deploying, and scaling Java web apps on Azure in \"Tutorial: Build a Quarkus web app with Azure App Service on Linux and PostgreSQL\" by multiple contributors. See how to create applications with the gRPC framework and Quarkus in \"gRPC made easy with Quarkus\" by F. Marchioni. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #26 - November"
  date: "November 17, 2022"
  blog_link: /blog/quarkus-newsletter-26/
  newsletter_link: /newsletter/26/
  summary: "Yep, you guessed it, it's time for the November Quarkus newsletter! Learn about the 2024 Observability roadmap with Roberto Cortez's article. Read about making web applications more resilient against certain types of fraud with Erik Costlow's \"Quarkus Defends REST APIs against Attack\" article. Watch a cool video to see how Adam Bien took his Java 6 / Java EE 6 sample / GlassFish application created live at the JDD 2012 conference (Java EE: Future Is Now, But It Is Not Evenly Distributed Yet) and migrated it to MicroProfile and deployed as AWS Lambda. See how Alberto Bonacina experimented with the Quarkus framework to solve a problem he had with saving articles to read them later from different PCs and smartphone. See how Stephen Mimmo switched to use Podman instead of Docker for spinning up Testcontainers on MacOS. Read Ivan Senic's great article to learn the decision-making process behind why Stargate for Apache Cassandra chose Quarkus over Spring Boot and Micronaut as their chosen Java framework. You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #25 - October"
  date: "October 11, 2022"
  blog_link: /blog/quarkus-newsletter-25/
  newsletter_link: /newsletter/25/
  summary: "It's that time of the month... time for the latest Quarkus newsletter! \"Tutorial: Build a Quarkus web app with Azure App Service on Linux and PostgreSQL\" walks you through the process of building, configuring, deploying, and scaling Java web apps on Azure. Vamil Kumar's article; \"Service discovery using SmallRye Stork with Quarkus\" discusses how Smallrye Stork helps you with both service discovery and selection of microservices. Learn how to easily deploy and run serverless functions from the open source project Knative Quarkus Bench on IBM Cloud Code Engine in Scott Trent's \"Using Knative Quarkus Bench to Perform Serverless Experiments on IBM Cloud Code Engine\". Lastly, check out Pierre Guimon's great \"Quarkus fundamentals\" which gives you an overview of Quarkus framework, as well as explaining its interactions with GraalVM. Piotr Minkowski discusses how the Quarkus framework handles Java Virtual threads in \"Quarkus with Java Virtual Threads\". You will also see the latest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #24 - September"
  date: "September 13, 2022"
  blog_link: /blog/quarkus-newsletter-24/
  newsletter_link: /newsletter/24/
  summary: "Time for the September Newsletter. Learn how to manage the same data in different forms to avoid dual writes and data loss with \"Debezium and Quarkus: Change Data Capture Patterns to Avoid Dual-Writes Problems\" by Alex Soto and Michael Redlich. Check out part 3 of Heiko Rupp's series on how to instrument code use with kafka and get trace propogation in \"Distributed Tracing with Quarkus, Python, Open Telemetry and Jaeger (Part 3)\". Learn about a cool new application \"Dashbuilder\" in this article by William Siqueira \"Monitoring Quarkus Applications with Dashbuilder\". \"Generate Helm charts manifests with Quarkus Helm\" by Jose Carvahal goes deep about Helm, the most popular package manager that finds, shares, and deploys software built for Kubernetes. Learn how to upload single and multiple files in an HTML form upload with a Quarkus application by watching the \"Uploading Files With Quarkus\" video video by Sebastian Daschener. You will also see the lastest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #23 - August"
  date: "August 17, 2022"
  blog_link: /blog/quarkus-newsletter-23/
  newsletter_link: /newsletter/23/
  summary: "The August Quarkus Newletter has been released! What's new this month? Plenty! Get a great understanding of OpenTelemetry with Eric Deandrea's article \"OpenTelemetry: A Quarkus Superheroes demo of Observability\". Get the good and bad experiences of a developer jumping into the deep end on a project with María Arias de Reyna Domínguez's article \"Bungee jumping into Quarkus: blindfolded but happy\". Roberto Piva has a wonderful article about \"API-first development with Quarkus\". Szabolcs Dékány discusses \"Native Images and Quarkus: JVM-less Java\". Learn about Redis® with Dewan Ahmed's \"Lightweight and blazing-fast Java app using Quarkus and Redis®\" article. You will also see the lastest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #22 - July"
  date: "July 14, 2022"
  blog_link: /blog/quarkus-newsletter-22/
  newsletter_link: /newsletter/22/
  summary: "The July newsletter is out with some great new Quarkus related technical articles. Learn about \"Kafka Streams and Quarkus: Real-Time Processing Events\" by Alex Soto and Michael Redlich. Get a better understanding of resilience deisgn patters in the \"Resilient microservices with Quarkus and Kotlin - Design Patterns\" article by Felicia Faye. Get a deep dive into active-active Kafka clusters with bi-direction replicaiton in \"Kafka Fail-Over Using Quarkus Reactive Messaging\" by Raffael Mendes. Daniel Oh takes us throw OpenTelemetry in \"Distributed tracing with OpenTelemetry, Knative, and Quarkus\". \"Using Amazon Corretto (OpenJDK) for lean, fast, and efficient AWS Lambda\" by Adam Bien shows us how to launch large, monolithic applications on top of AWS Lambda. You will also see the lastest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #21 - June"
  date: "June 13, 2022"
  blog_link: /blog/quarkus-newsletter-21/
  newsletter_link: /newsletter/21/
  summary: "The June newsletter has some great new Quarkus articles. Learn how Banco do Brazil used Quarkus to create a new system to integrate with other financial institutions that participate in the Brazilian Open Banking environment. Get technical on how to configure Podman for Quarkus Dev Services and Testcontainers on Linux in an article by Michal Jurč. Gary A. Stafford teaches about Developing, testing, building, and deploying Native Quarkus-based Java microservices to Kubernetes on AWS, using GitOps. Daniel Oh has shares some great tips in \"Build a Quarkus reactive application using Kubernetes Secrets\". F. Marchioni wrote a great tutorial on \"Creating Quarkus applications using IntelliJ IDEA\". Roudranil Roy discusses his pursuit of developer KNative joy in his \"Quarkus & KNative— An Attempt\" article. You will also see the lastest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #20 - May"
  date: "May 12, 2022"
  blog_link: /blog/quarkus-newsletter-20/
  newsletter_link: /newsletter/20/
  summary: "The May newsletter is out! Read the great article \"Native Java in the Real World\" describing how Microservices on Kubernetes are the business case sweet spot for native Java because they have the most significant framework and Java runtime overhead. As well as How to use Camel extensions for Quarkus to build powerful Java Integrations. There is a cool short step-by-step guide to create a new microservice in \"Reactive Timer Microservice with Java Quartz, DynamoDB and Quarkus\". Get the baseline knowledge and understanding Reactive Messaging with Apache Kafka with \"Getting Started to Quarkus Reactive Messaging with Apache Kafka\". \"Process Formula 1 telemetry with Quarkus and OpenShift Streams for Apache Kafka\" is a great article showing how race team engineers can exploit multiple software technologies to process telemetry data in a Java application in real time. Follow up with \"3 Reasons Why All Java Developers Should Consider Quarkus\". You will also see the lastest Quarkus Insights episodes, top tweets and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #19 - April"
  date: "April 14, 2022"
  blog_link: /blog/quarkus-newsletter-19/
  newsletter_link: /newsletter/19/
  summary: "The April newsletter has been sent. It's full of great new articles like \"Kubernetes Native Java with Quarkus\" by Jason Greene, John Clingan and Eric Deandrea. Others include:Develop and Deploy Cloud Native Java Applications at Supersonic speed, Build a REST API from the ground up with Quarkus 2.0, Building Databases on Kubernetes with Quarkus, Insights on Vaadin with Quarkus, Quarkus Tools for Visual Studio Code - 1.10.0 release, Qute Templating Engine Support - Now Available for Quarkus Tools for Visual Studio Code, and Riding Camel Quarkus: effortless APIs. You will also see the lastest Quarkus Insights episodes and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #18 - March"
  date: "March 17, 2022"
  blog_link: /blog/quarkus-newsletter-18/
  newsletter_link: /newsletter/18/
  summary: "The March newsletter has been sent. Learn about what's new with Java 17 and containers, read about LogicDrop and Vaadin's path to using Quarkus, and get a look at Continuous testing with Quarkus. Additionally, you'll get more insights into how Keycloak is ow fully cloud-native with Quarkus and learn how to create your first API with Kotlin and Quarkus. Also see the lastest Quarkus Insights episodes and upcoming Quarkus attended events."

- title: "Quarkus Newsletter #17 - February"
  date: "February 23, 2022"
