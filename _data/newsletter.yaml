  newsletter_link: /newsletter/17/
  summary: "The February Newsletter has been published! This month, you can find an introduction to the new Quarkus Superheroes sample application as well as articles teaching you how to get started with Stork Service Discovery, Java Asynchronous Programming with Java, Distributed tracing with Istio, Quarkus and Jaeger, Monitoring Quarkus Prometheus and Grafana, and how to create a Quarkus extension for AWS Cloudwatch. Of course it includes selected Quarkus Insights podcast videos, top tweets, and the latest community events around Quarkus."

