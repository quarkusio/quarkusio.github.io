# OSV API base URL
quarkus.rest-client.osv-api.url=https://api.osv.dev

# Maven Central — the Quarkus platform BOM (io.quarkus.platform:quarkus-bom) is the source of truth
# for which artifacts belong to Quarkus, and which versions ship in which release.
quarkus.rest-client.maven-central.url=https://repo1.maven.org/maven2
quarkus.rest-client.maven-central.connect-timeout=10000
quarkus.rest-client.maven-central.read-timeout=30000

# Quarkus Extension Registry — cross-reference for artifacts the BOM no longer lists
quarkus.rest-client.quarkus-registry.url=https://registry.quarkus.io

# Quarkus CLI / Picocli mode — suppress the startup banner and CDI logs
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.level=WARN

# GitHub Advisory API
# Set GITHUB_TOKEN in .env (never commit that file) to raise the rate limit
# from 60 req/hr (unauthenticated) to 5,000 req/hr (authenticated).
# The GitHubAuthFilter reads this config key and attaches "Bearer <token>".
quarkus.rest-client.github-api.url=https://api.github.com
quarkus.rest-client.github-api.headers.Accept=application/vnd.github+json
quarkus.rest-client.github-api.headers.X-GitHub-Api-Version=2022-11-28
# github.token is read from the GITHUB_TOKEN environment variable by GitHubAuthFilter.
# It is intentionally absent here so it resolves to Optional.empty() when not set.
# Set it via .env or shell export — do NOT add it to this file.

# Connect / read timeouts (ms)
quarkus.rest-client.osv-api.connect-timeout=10000
quarkus.rest-client.osv-api.read-timeout=30000
quarkus.rest-client.github-api.connect-timeout=10000
quarkus.rest-client.github-api.read-timeout=30000
