<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jakarta RESTful Web Services</title>

    <!-- JavaScript to dynamically capture and forward the #fragment -->
    <script>
        (function() {
            const destination = "https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1.html";
            // window.location.hash captures everything starting with '#' (e.g., '#anchor')
            const hash = window.location.hash;
            // Redirect immediately with the fragment attached
            window.location.replace(destination + hash);
        })();
    </script>

    <!--  Fallback Meta Refresh (for users with JavaScript disabled) -->
    <meta http-equiv="refresh" content="0; url=https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1.html">
    <link rel="canonical" href="https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1.html">
</head>
<body>
    <p>This page has moved to <a href="https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1.html">https://jakarta.ee/specifications/restful-ws/3.1/jakarta-restful-ws-spec-3.1.html</a>.</p>
</body>
</html>
