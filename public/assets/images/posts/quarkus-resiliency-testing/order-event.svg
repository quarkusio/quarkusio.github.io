<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">The sample waits for Kafka before committing</title><desc id="desc">An uncommitted database write is followed by a Kafka send. Acknowledgement allows the database commit; a send failure rolls the database transaction back. These are not an atomic database and Kafka transaction.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4695EB"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C9003B"/></marker></defs>
<rect width="900" height="340" rx="12" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="32" y="42" font-size="24" fill="#09131E" text-anchor="start" font-weight="600">The sample waits for Kafka before committing</text>
<rect x="30" y="108" width="245" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="152.5" y="139" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Write order</text><text x="152.5" y="165" font-size="16" fill="#09131E" text-anchor="middle" font-weight="400">Database: uncommitted</text><path d="M 275 148 L 330 148" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="330" y="108" width="245" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="452.5" y="139" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Publish event</text><text x="452.5" y="165" font-size="16" fill="#09131E" text-anchor="middle" font-weight="400">Wait for Kafka</text><path d="M 575 148 L 630 148" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><text x="604" y="131" font-size="14" fill="#09131E" text-anchor="middle" font-weight="400">ACK</text><rect x="630" y="108" width="240" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="750.0" y="139" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Commit order</text><text x="750.0" y="165" font-size="16" fill="#09131E" text-anchor="middle" font-weight="400">Database</text><path d="M452 188 V270 H628" fill="none" stroke="#C9003B" stroke-width="2.5" marker-end="url(#red)"/><text x="472" y="241" font-size="17" fill="#C9003B" text-anchor="start" font-weight="400">Send fails</text><rect x="630" y="230" width="240" height="80" rx="8" fill="#FFF0F4" stroke="#C9003B" stroke-width="2"/><text x="750.0" y="261" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Roll back order</text><text x="750.0" y="287" font-size="16" fill="#09131E" text-anchor="middle" font-weight="400">Database</text>
</g></svg>
