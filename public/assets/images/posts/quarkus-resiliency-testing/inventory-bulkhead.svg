<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Two waiting calls are enough</title><desc id="desc">Orders A and B occupy both bulkhead slots waiting for inventory. Order C is rejected by the full bulkhead and falls back to a pending response.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4695EB"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C9003B"/></marker></defs>
<rect width="900" height="390" rx="12" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="32" y="42" font-size="24" fill="#09131E" text-anchor="start" font-weight="600">Two waiting calls are enough</text>
<rect x="266" y="75" width="336" height="205" rx="10" fill="#F5F9FE" stroke="#4695EB" stroke-width="2"/><text x="434" y="106" font-size="16" fill="#09131E" text-anchor="middle" font-weight="600">BULKHEAD · 2 / 2 SLOTS BUSY</text><rect x="32" y="125" width="150" height="60" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="107.0" y="162.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Order A</text><path d="M 182 155 L 286 155" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="286" y="125" width="295" height="60" rx="8" fill="#FFFFFF" stroke="#4695EB" stroke-width="2"/><text x="433.5" y="162.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Inventory call 1</text><path d="M 581 155 L 659 155" fill="none" stroke="#C9003B" stroke-width="2.5" marker-end="url(#red)"/><text x="747" y="161" font-size="20" fill="#C9003B" text-anchor="middle" font-weight="400">Waiting…</text><rect x="32" y="205" width="150" height="60" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="107.0" y="242.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Order B</text><path d="M 182 235 L 286 235" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="286" y="205" width="295" height="60" rx="8" fill="#FFFFFF" stroke="#4695EB" stroke-width="2"/><text x="433.5" y="242.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Inventory call 2</text><path d="M 581 235 L 659 235" fill="none" stroke="#C9003B" stroke-width="2.5" marker-end="url(#red)"/><text x="747" y="241" font-size="20" fill="#C9003B" text-anchor="middle" font-weight="400">Waiting…</text><rect x="32" y="310" width="150" height="60" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="107.0" y="347.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Order C</text><path d="M 182 340 L 286 340" fill="none" stroke="#C9003B" stroke-width="2.5" marker-end="url(#red)"/><rect x="286" y="310" width="190" height="60" rx="8" fill="#FFF0F4" stroke="#C9003B" stroke-width="2"/><text x="381.0" y="347.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Full: reject</text><path d="M 476 340 L 539 340" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="539" y="310" width="180" height="60" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="629.0" y="347.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Fallback</text><path d="M 719 340 L 760 340" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><text x="819" y="334" font-size="22" fill="#09131E" text-anchor="middle" font-weight="600">202</text><text x="819" y="357" font-size="14" fill="#09131E" text-anchor="middle" font-weight="400">PENDING</text>
</g></svg>
