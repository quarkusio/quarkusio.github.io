<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">Inject the failure where the client can see it</title><desc id="desc">Inside the test JVM, a test calls the order service and configures a proxy between the real client and the external dependency.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4695EB"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C9003B"/></marker></defs>
<rect width="900" height="350" rx="12" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="32" y="42" font-size="24" fill="#09131E" text-anchor="start" font-weight="600">Inject the failure where the client can see it</text>
<rect x="24" y="70" width="680" height="255" rx="10" fill="#F5F9FE" stroke="#4695EB" stroke-dasharray="7 6"/><text x="43" y="99" font-size="14" fill="#09131E" text-anchor="start" font-weight="600">TEST JVM</text><rect x="43" y="130" width="110" height="65" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="98.0" y="169.5" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Test</text><path d="M 153 163 L 194 163" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="194" y="130" width="164" height="65" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="276.0" y="169.5" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Order service</text><path d="M 358 163 L 398 163" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="398" y="130" width="140" height="65" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="468.0" y="169.5" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Real client</text><path d="M 538 163 L 579 163" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="579" y="130" width="108" height="65" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="633.0" y="169.5" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Proxy</text><path d="M 687 163 L 741 163" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="741" y="130" width="140" height="65" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="811.0" y="169.5" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Dependency</text><path d="M98 195 V262 H633 V197" fill="none" stroke="#C9003B" stroke-width="2.5" marker-end="url(#red)"/><text x="365" y="249" font-size="18" fill="#C9003B" text-anchor="middle" font-weight="400">Apply fault: hang, reset, 503…</text><text x="365" y="303" font-size="17" fill="#09131E" text-anchor="middle" font-weight="400">Real client timeouts, retries and exceptions</text>
</g></svg>
