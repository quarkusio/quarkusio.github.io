<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">One order, three dependencies</title><desc id="desc">A customer calls the order service, which reserves inventory, charges a payment and stores the order.</desc>
