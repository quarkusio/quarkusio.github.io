<rect width="900" height="360" rx="12" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="32" y="42" font-size="24" fill="#09131E" text-anchor="start" font-weight="600">One order, three dependencies</text>
<rect x="32" y="163" width="160" height="72" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="112.0" y="206.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Customer</text><path d="M 192 199 L 270 199" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="270" y="163" width="200" height="72" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="370.0" y="206.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Order service</text><path d="M470 199 H535 M535 109 V289" fill="none" stroke="#4695EB" stroke-width="2.5"/><path d="M 535 109 L 610 109" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="610" y="70" width="255" height="78" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="737.5" y="101" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Inventory</text><text x="737.5" y="127" font-size="16" fill="#09131E" text-anchor="middle" font-weight="400">Reserve stock</text><path d="M 535 199 L 610 199" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="610" y="160" width="255" height="78" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="737.5" y="191" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Payments</text><text x="737.5" y="217" font-size="16" fill="#09131E" text-anchor="middle" font-weight="400">Charge card</text><path d="M 535 289 L 610 289" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="610" y="250" width="255" height="78" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="737.5" y="281" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Database</text><text x="737.5" y="307" font-size="16" fill="#09131E" text-anchor="middle" font-weight="400">Store order</text>
</g></svg>
