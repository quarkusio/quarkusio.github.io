<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">A lost response must not become a second charge</title><desc id="desc">The provider records a charge with key K, but the response is lost. Retrying with the same key returns the original result and does not create a new charge.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4695EB"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C9003B"/></marker></defs>
<rect width="900" height="490" rx="12" fill="#FFFFFF"/>
<g font-family="Helvetica, Arial, sans-serif">
<text x="32" y="42" font-size="24" fill="#09131E" text-anchor="start" font-weight="600">A lost response must not become a second charge</text>
<rect x="45" y="70" width="230" height="60" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="160.0" y="107.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Order service</text><rect x="590" y="70" width="265" height="60" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="722.5" y="107.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Payment provider</text><path d="M 160 130 L 160 445" fill="none" stroke="#4695EB" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M 722 130 L 722 445" fill="none" stroke="#4695EB" stroke-width="2.5" stroke-dasharray="7 6"/><text x="441" y="164" font-size="19" fill="#09131E" text-anchor="middle" font-weight="400">1. Charge with key K</text><path d="M 160 182 L 722 182" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><rect x="620" y="198" width="205" height="46" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="722.5" y="228.0" font-size="20" fill="#09131E" text-anchor="middle" font-weight="600">Record charge</text><text x="461" y="271" font-size="19" fill="#C9003B" text-anchor="middle" font-weight="400">2. Response lost</text><path d="M 722 286 L 355 286" fill="none" stroke="#C9003B" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M343 274 L367 298 M367 274 L343 298" stroke="#C9003B" stroke-width="3"/><text x="441" y="333" font-size="19" fill="#09131E" text-anchor="middle" font-weight="400">3. Retry with the same key K</text><path d="M 160 350 L 722 350" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><text x="441" y="398" font-size="19" fill="#09131E" text-anchor="middle" font-weight="400">4. Return the original result</text><path d="M 722 416 L 160 416" fill="none" stroke="#4695EB" stroke-width="2.5" marker-end="url(#blue)"/><text x="450" y="465" font-size="21" fill="#09131E" text-anchor="middle" font-weight="600">Two attempts. One charge.</text>
</g></svg>
