<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">The cookie crosses a process boundary</title><desc id="desc">Two requests by the same customer go to different instances. With separate encryption keys, the second instance rejects the first instance’s cookie.</desc><rect width="900" height="330" rx="12" fill="white"/><g font-family="Helvetica, Arial, sans-serif"><text x="30" y="40" font-size="24" fill="#09131E" text-anchor="start">The cookie crosses a process boundary</text><rect x="30" y="140" width="180" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="120.0" y="171" font-size="20" fill="#09131E" text-anchor="middle">Customer</text><text x="120.0" y="197" font-size="16" fill="#09131E" text-anchor="middle">Same browser</text><rect x="540" y="80" width="325" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="702.5" y="111" font-size="20" fill="#09131E" text-anchor="middle">Instance 0 · key A</text><text x="702.5" y="137" font-size="16" fill="#09131E" text-anchor="middle">Login succeeds; issues cookie</text><rect x="540" y="220" width="325" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="702.5" y="251" font-size="20" fill="#09131E" text-anchor="middle">Instance 1 · key B</text><text x="702.5" y="277" font-size="16" fill="#09131E" text-anchor="middle">Cannot decrypt cookie</text><path d="M210 168 L540 120" stroke="#4695EB" stroke-width="2.5"/><path d="M540 120 L529.3844363785843 116.49146626071855 L530.8238348357254 126.38733065356367 Z" fill="#4695EB"/><text x="365" y="114" font-size="18" fill="#09131E" text-anchor="middle">1. Log in</text><path d="M210 200 L540 260" stroke="#C9003B" stroke-width="2.5"/><path d="M540 260 L531.0557280900008 253.29179606750063 L529.2668737080011 263.1304951684997 Z" fill="#C9003B"/><text x="358" y="263" font-size="18" fill="#C9003B" text-anchor="middle">2. Open account</text></g></svg>
