<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">One payment key, shared knowledge</title><desc id="desc">The first payment reaches instance 0 and a retry reaches instance 1. Both use a shared JDBC idempotency store, so the retry replays the saved result.</desc><rect width="900" height="390" rx="12" fill="white"/><g font-family="Helvetica, Arial, sans-serif"><text x="30" y="40" font-size="24" fill="#09131E" text-anchor="start">One payment key, shared knowledge</text><rect x="30" y="95" width="245" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="152.5" y="126" font-size="20" fill="#09131E" text-anchor="middle">Instance 0</text><text x="152.5" y="152" font-size="16" fill="#09131E" text-anchor="middle">First payment · key K</text><rect x="625" y="95" width="245" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="747.5" y="126" font-size="20" fill="#09131E" text-anchor="middle">Instance 1</text><text x="747.5" y="152" font-size="16" fill="#09131E" text-anchor="middle">Retry · same key K</text><rect x="260" y="245" width="380" height="80" rx="8" fill="#EDF5FE" stroke="#4695EB" stroke-width="2"/><text x="450.0" y="276" font-size="20" fill="#09131E" text-anchor="middle">Shared JDBC idempotency store</text><text x="450.0" y="302" font-size="16" fill="#09131E" text-anchor="middle">Key K → original payment result</text><path d="M152 175 L335 245" stroke="#4695EB" stroke-width="2.5"/><path d="M335 245 L327.4463246423004 236.75730695764537 L323.87364035149653 246.0973244607469 Z" fill="#4695EB"/><path d="M747 175 L565 245" stroke="#4695EB" stroke-width="2.5"/><path d="M565 245 L576.1283514585749 246.07693723792661 L572.5385606654862 236.743481175896 Z" fill="#4695EB"/><text x="190" y="215" font-size="17" fill="#09131E" text-anchor="middle">Record</text><text x="710" y="215" font-size="17" fill="#09131E" text-anchor="middle">Look up</text><text x="450" y="365" font-size="18" fill="#09131E" text-anchor="middle">The retry does not create another payment.</text></g></svg>
