<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345" role="img" aria-labelledby="title desc"><title id="title">Readiness changes before routing catches up</title><desc id="desc">After SIGTERM, the load balancer can still route to the stopping instance for a propagation window. A shutdown delay keeps the instance serving through that window.</desc><rect width="900" height="345" rx="12" fill="white"/><g font-family="Helvetica, Arial, sans-serif"><text x="30" y="40" font-size="24" fill="#09131E" text-anchor="start">Readiness changes before routing catches up</text><text x="30" y="92" font-size="17" fill="#09131E" text-anchor="start">SIGTERM</text><text x="590" y="92" font-size="17" fill="#09131E" text-anchor="middle">Routing updated</text><rect x="180" y="110" width="410" height="175" rx="8" fill="#F5F9FE"/><text x="385" y="137" font-size="17" fill="#09131E" text-anchor="middle">Endpoint-removal propagation window</text><text x="30" y="187" font-size="18" fill="#09131E" text-anchor="start">No delay</text><path d="M180 182 L590 182" stroke="#C9003B" stroke-width="2.5"/><path d="M590 182 L580.0 177.0 L580.0 187.0 Z" fill="#C9003B"/><text x="385" y="173" font-size="17" fill="#C9003B" text-anchor="middle">Late arrivals can fail</text><text x="30" y="252" font-size="18" fill="#09131E" text-anchor="start">With delay</text><path d="M180 247 L810 247" stroke="#4695EB" stroke-width="2.5"/><path d="M810 247 L800.0 242.0 L800.0 252.0 Z" fill="#4695EB"/><text x="385" y="237" font-size="17" fill="#09131E" text-anchor="middle">Unready, but still serving</text><text x="705" y="285" font-size="17" fill="#09131E" text-anchor="middle">Then stop listening</text><text x="450" y="324" font-size="18" fill="#09131E" text-anchor="middle">Model the window; assert that requests still succeed.</text></g></svg>
