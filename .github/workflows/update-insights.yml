name: Update Insights Sessions archive/upcoming

on:
  schedule:
    - cron: '0 * * * 1'
  pull_request:
    paths:
      - '_data/insights-videos.yaml'
      - '.github/workflows/update-insights.yml'
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'quarkusio/quarkusio.github.io' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'quarkus-push-website' || '' }}
    steps:
      - name: Generate GitHub App token
        if: github.event_name != 'pull_request'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.QUARKUS_PUSH_WEBSITE_APP_ID }}
          private-key: ${{ secrets.QUARKUS_PUSH_WEBSITE_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - name: Archive current session
        id: archive_session
        run: |
          today=$(date +"%B %d, %Y")

          nextsessiondate=$(yq -r '.nextsessiondate' _data/insights-videos.yaml)
          if [ -z "$nextsessiondate" ] || [ "$nextsessiondate" == "null" ]; then
            echo "Error: Could not read nextsessiondate from YAML"
            exit 1
          fi

          nextsessiondate_formatted=$(date --date="$nextsessiondate" +"%B %d, %Y")

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "DRY-RUN: Would check if today ($today) matches next session date ($nextsessiondate_formatted)"
          elif [ "$today" != "$nextsessiondate_formatted" ]; then
            echo "Next session date ($nextsessiondate_formatted) does not match today's date ($today). Skipping workflow run."
            exit 0
          fi

          current_episode=$(yq -r '.nextsessiontitle | sub(".* #([0-9]+):.*"; "${1}")' _data/insights-videos.yaml)
          if ! [[ "$current_episode" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not extract episode number from nextsessiontitle. Got: '$current_episode'"
            exit 1
          fi
          echo "Current episode number: $current_episode"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "DRY-RUN: Would fetch YouTube video for episode #$current_episode"
            video_link="https://www.youtube.com/watch?v=DRY_RUN_VIDEO_ID"
          else
            youtube_response=$(curl -s --fail \
                "https://www.youtube.com/feeds/videos.xml?channel_id=${{ secrets.INSIGHTS_YOUTUBE_CHANNEL_ID }}") || {
              echo "Error: YouTube RSS feed request failed"
              exit 1
            }

            video_id=$(echo "$youtube_response" | grep -o "<yt:videoId>[^<]*</yt:videoId>" | sed 's/<[^>]*>//g' | head -1)

            if [ -z "$video_id" ]; then
              echo "Could not find the YouTube video for episode #$current_episode. Assuming it's not there yet. Exiting..."
              exit 0
            fi

            video_link="https://www.youtube.com/watch?v=${video_id}"
          fi
          nextsessiontitle="$(yq '.nextsessiontitle' _data/insights-videos.yaml)"
          nextsessionguest="$(yq '.nextsessionguest' _data/insights-videos.yaml)"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "DRY-RUN: Would add to pastvideos:"
            echo "  Title: $nextsessiontitle"
            echo "  Date: $nextsessiondate_formatted"
            echo "  Authors: $nextsessionguest"
            echo "  Link: $video_link"
          else
            yq -i '
              .pastvideos = [
              {
                "title": "'"$nextsessiontitle"'",
                "date": "'"$nextsessiondate_formatted"'",
                "authors": "'"$nextsessionguest"'",
                "link": "'"$video_link"'"
              }
            ] + .pastvideos
            ' _data/insights-videos.yaml
          fi

          echo "title=$(yq '.nextsessiontitle' _data/insights-videos.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set next session information
        if: steps.archive_session.outputs.title != ''
        run: |
          # Read the next upcoming session BEFORE deleting the current one
          title=$(yq '.futurevideos[1].title' _data/insights-videos.yaml)
          guests=$(yq '.futurevideos[1].authors' _data/insights-videos.yaml)
          date_raw=$(yq '.futurevideos[1].date' _data/insights-videos.yaml)

          if [ -z "$title" ] || [ "$title" == "null" ]; then
            echo "Warning: No future videos remaining in the queue"
            exit 0
          fi

          # Remove ordinal suffixes (st, nd, rd, th) from date
          date_clean=$(echo "$date_raw" | sed 's/\([0-9]\+\)\(st\|nd\|rd\|th\)/\1/')
          date_iso=$(date --date="$date_clean" +"%Y-%m-%d")
          date=${date_iso}T13:00Z

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "DRY-RUN: Would delete futurevideos[0]"
            echo "DRY-RUN: Would set next session to:"
            echo "  Title: $title"
            echo "  Guest: $guests"
            echo "  Date: $date"
          else
            yq -i 'del(.futurevideos[0])' _data/insights-videos.yaml
            yq -i '.nextsessiontitle = "'"$title"'"' _data/insights-videos.yaml
            yq -i '.nextsessionguest = "'"$guests"'"' _data/insights-videos.yaml
            yq -i '.nextsessiondate = "'"$date"'"' _data/insights-videos.yaml
          fi

      - name: Commit and push
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/insights-videos.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update Insights sessions archive"
            git pull origin main --rebase
            git push origin main
          fi
