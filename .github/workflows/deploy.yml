name: Build and deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

# The build, the deployment and the gh-pages sync are separate jobs so that, if the deployment
# or the sync fails (e.g. because of GitHub infrastructure issues), "Re-run failed jobs" retries
# them with the site already built instead of building it again.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for the git dates of the sitemap <lastmod>

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: QUARKUS_ROQ_GENERATOR_BATCH=true mvn -B package quarkus:run -DskipTests

      # Publish the theme jar for other sites, in a Maven repository served at https://quarkus.io/maven/
      - name: Publish the theme
        run: mvn -B -f theme/pom.xml deploy -DaltDeploymentRepository=quarkus-website::file:${{ github.workspace }}/target/roq/maven

      # Artifacts of all the attempts of a run are kept in the run, and deploy-pages fails if several
      # have the same name, so name the artifact after the attempt. The deploy and sync jobs get the
      # name from the job output, as "Re-run failed jobs" reruns them with a newer attempt number.
      - name: Name the Pages artifact
        id: artifact
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v4.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ./target/roq
          include-hidden-files: true
          retention-days: 2

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}

  # search.quarkus.io expects that the rendered content is available in gh-pages branch
  sync-gh-pages:
    name: Sync gh-pages branch
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/github-pages

      - name: Sync gh-pages branch
        run: |
          SITE_DIR="$RUNNER_TEMP/site"
          mkdir -p "$SITE_DIR"
          tar -xf "$RUNNER_TEMP/github-pages/artifact.tar" -C "$SITE_DIR"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          rsync -a --delete --exclude='.git' --exclude='.nojekyll' "$SITE_DIR"/ .
          git add -A

          git commit --allow-empty -m "deploy: ${{ github.sha }}"
          git push origin gh-pages
