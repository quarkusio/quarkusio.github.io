name: Sync releases

on:
  schedule:
    - cron: '23 */12 * * *' # every 12 hours
  pull_request:
    paths:
      - 'src/main/java/io/quarkusio/releases/**'
      - 'config/application-data-sync.properties'
      - '.github/workflows/sync-releases.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: github.repository == 'quarkusio/quarkusio.github.io' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'quarkus-push-website' || '' }}
    steps:
      - name: Generate GitHub App token
        if: github.event_name != 'pull_request'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QUARKUS_PUSH_WEBSITE_APP_ID }}
          private-key: ${{ secrets.QUARKUS_PUSH_WEBSITE_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

          cache: maven

      - name: Test release sync
        run: ./mvnw -B test -Dtest='ReleasesSyncTest,WikiReleasePlanningTest'

      # The data-sync profile builds the site with its data only (no content), and runs the sync at startup
      - name: Build sync job
        run: ./mvnw -B package -DskipTests -Dquarkus.profile=data-sync

      - name: Run release sync
        run: java -Dquarkus.profile=data-sync -jar target/quarkus-app/quarkus-run.jar
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || github.token }}

      # On pull requests, this is the dry run: the changes are shown but not committed
      - name: Show changes
        run: git diff -- _data/releases.yaml

      - name: Commit and push
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/releases.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Sync releases data"
            git pull origin main --rebase
            git push origin main
          fi
