name: Sync component categories

on:
  schedule:
    - cron: '41 4 * * 1' # weekly: the recommended platform release and its dependencies change slowly
  pull_request:
    paths:
      - 'tools/componentcategories-sync/**'
      - 'src/main/java/io/quarkusio/categories/ComponentCategories.java'
      - '.github/workflows/sync-componentcategories.yml'
  workflow_dispatch:

concurrency:
  group: sync-componentcategories-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    if: github.repository == 'quarkusio/quarkusio.github.io' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'quarkus-push-website' || '' }}
    steps:
      - name: Generate GitHub App token
        if: github.event_name != 'pull_request'
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.QUARKUS_PUSH_WEBSITE_APP_ID }}
          private-key: ${{ secrets.QUARKUS_PUSH_WEBSITE_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: jbangdev/setup-jbang@main

      - name: Test the category rules
        working-directory: tools/componentcategories-sync
        run: jbang CategoryAssignmentTest.java

      - name: Test the platform descriptor reader
        working-directory: tools/componentcategories-sync
        run: jbang PlatformDescriptorTest.java

      - name: Run component categories sync
        # Run from the script's directory to avoid picking up the website's config/application.properties
        working-directory: tools/componentcategories-sync
        run: jbang main.java
        env:
          COMPONENTCATEGORIES_OUTPUT: ../../_data/componentcategories.yaml

      - name: Show what changed
        if: github.event_name == 'pull_request'
        run: git diff --stat -- _data/componentcategories.yaml

      - name: Commit and push
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/componentcategories.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Sync component categories"
            git pull origin main --rebase
            git push origin main
          fi
