name: Surge.sh Preview

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

defaults:
  run:
    shell: bash

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
      packages: read
      # this is unfortunately needed to be able to write comments on pull requests
      pull-requests: write
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
    - name: Download PR Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        run-id: ${{ github.event.workflow_run.id }}
        name: site
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Store PR id as variable
      id: pr
      run: |
        pr=$(<pr-id.txt)
        if ! [[ $pr =~ ^[0-9]+$ ]] ; then
          echo "PR id extracted from pr-id.txt is not a number: $pr"
          exit 1
        fi
        echo "id=${pr}" >> $GITHUB_OUTPUT
        rm -f pr-id.txt
    - name: List changed pages
      id: pages
      run: |
        base="https://quarkus-website-pr-${PR_ID}-preview.surge.sh"
        links=""
        # changed-pages.txt is written by the build job and holds the outcome of comparing with
        # the live site (skip, partial or full) on the first line, the comma separated changed pages
        # on the second, how many pages changed on the third, whether infra files changed on the fourth,
        # and why the comparison failed, if it did, on the fifth
        if [ -f changed-pages.txt ]; then
          { read -r mode; IFS=',' read -ra paths; read -r count || true; read -r infra || true; read -r reason || true; } < changed-pages.txt
          rm -f changed-pages.txt
          [[ $count =~ ^[0-9]+$ ]] || count=""
          [ "$infra" = "true" ] && links=$'\n'"🏗️ This PR changes the site infrastructure (build, configuration, Java sources or templates), so any page could be affected."
          case "$mode" in
            skip)
              links+=$'\n'"🤔 It looks like nothing changed compared to the live site."
              ;;
            full)
              if [ -n "$count" ]; then
                links+=$'\n'"🌊 Many pages changed (${count}), so they are not listed individually."
              else
                # the artifact comes from the PR, so map the reason code rather than echoing it
                case "$reason" in
                  fetch-failed) why="the gh-pages branch holding the live site could not be fetched" ;;
                  checkout-failed) why="the live site could not be checked out from the gh-pages branch" ;;
                  compare-failed) why="comparing the built pages with the live site failed" ;;
                  *) why="the build did not record why" ;;
                esac
                links+=$'\n'"🌫️ Changed pages are not listed because the build could not compare the site with the live site: ${why}."
              fi
              ;;
            partial)
              # deep links are only listed when fewer than 5 pages changed
              if [ "${#paths[@]}" -ge 5 ]; then
                links+=$'\n'"🌊 Many pages changed (${#paths[@]}), so they are not listed individually."
              else
                list=""
                for p in "${paths[@]}"; do
                  # the artifact comes from the PR, so only accept plain paths
                  [[ $p =~ ^/[A-Za-z0-9_./-]*$ ]] || continue
                  list+="- ${base}${p}"$'\n'
                done
                [ -n "$list" ] && links+=$'\n'"👀 Changed pages:"$'\n\n'"${list}"
              fi
              ;;
          esac
          links=${links%$'\n'}
          [ -n "$links" ] && links+=$'\n\n'"_Change detection can sometimes be wrong, so treat this as a guide only._"
        fi
        {
          echo "links<<EOF_LINKS"
          echo "$links"
          echo "EOF_LINKS"
        } >> $GITHUB_OUTPUT
      env:
        PR_ID: ${{ steps.pr.outputs.id }}

    - name: Publishing to surge for preview
      id: deploy
      run: npx surge@0.23.1 ./ --domain https://quarkus-website-pr-${PR_ID}-preview.surge.sh --token ${{ secrets.SURGE_TOKEN }}
      env:
        PR_ID: ${{  steps.pr.outputs.id }}

    - name: Update PR status comment on success
      uses: quarkusio/action-helpers@main
      with:
        action: maintain-one-comment
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr-number: ${{ steps.pr.outputs.id }}
        body: |
          🚀 PR Preview ${{ github.sha }} has been successfully built and deployed to https://quarkus-website-pr-${{ steps.pr.outputs.id }}-preview.surge.sh
          ${{ steps.pages.outputs.links }}

          - ✂️ Images of blog posts older than 3 months are not available.
          - ✂️ Newsletters older than 3 months are not available.

          <img width="300" src="https://user-images.githubusercontent.com/507615/90250366-88233900-de6e-11ea-95a5-84f0762ffd39.png">
        body-marker: <!-- Preview status comment marker -->
    - name: Update PR status comment on failure
      uses: quarkusio/action-helpers@main
      if: ${{ failure() }}
      with:
        action: maintain-one-comment
        github-token: ${{ secrets.GITHUB_TOKEN }}
        pr-number: ${{ steps.pr.outputs.id }}
        body: |
          😩 Deploy PR Preview failed.
          <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
        body-marker: <!-- Preview status comment marker -->
